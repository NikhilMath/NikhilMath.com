# Keeps the book covers at the bottom of the homepage in sync with Goodreads.
# Commits only when the shelves changed, and that push redeploys on Netlify.
name: Update books

on:
  schedule:
    - cron: "0 12 * * *" # daily, around 6am in Utah
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-books

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull the latest shelves from Goodreads
        run: python3 .github/scripts/update-books.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update My Books From Goodreads"
          git push
