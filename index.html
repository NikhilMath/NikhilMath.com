<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nikhil Math</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --bg-card: #11161d;
      --border: #1f2a37;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #7ee787;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(126, 231, 135, 0.06), transparent 60%),
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .prompt {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .prompt .accent { color: var(--accent); }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--accent);
      vertical-align: -2px;
      margin-left: 2px;
      animation: blink 1.1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }

    h1 {
      margin: 0 0 24px 0;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    ul.links {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    ul.links a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }
    ul.links a:hover {
      border-color: var(--accent);
      background: rgba(126, 231, 135, 0.04);
    }
    ul.links a:active { transform: translateY(1px); }

    .label { color: var(--muted); min-width: 78px; }
    .value { color: var(--text); }
    .arrow { margin-left: auto; color: var(--muted); }
    ul.links a:hover .arrow { color: var(--accent); }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      h1 { font-size: 26px; }
      .label { min-width: 68px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="prompt"><span class="accent">~</span> nikhil@math:<span class="accent">$</span> whoami<span class="cursor"></span></div>
    <h1>Nikhil Math</h1>

    <ul class="links">
      <li>
        <a href="https://github.com/NikhilMath" target="_blank" rel="noopener">
          <span class="label">github</span>
          <span class="value">NikhilMath</span>
          <span class="arrow">&rarr;</span>
        </a>
      </li>
      <li>
        <a href="https://www.linkedin.com/in/nikhil-math/" target="_blank" rel="noopener">
          <span class="label">linkedin</span>
          <span class="value">nikhil-math</span>
          <span class="arrow">&rarr;</span>
        </a>
      </li>
      <li>
        <a href="mailto:erulemath@gmail.com">
          <span class="label">email</span>
          <span class="value">erulemath@gmail.com</span>
          <span class="arrow">&rarr;</span>
        </a>
      </li>
      <li>
        <a href="tel:+14359194041">
          <span class="label">phone</span>
          <span class="value">+1 435 919 4041</span>
          <span class="arrow">&rarr;</span>
        </a>
      </li>
    </ul>

    <footer>&copy; <span id="year"></span> Nikhil Math</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
