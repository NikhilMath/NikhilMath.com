<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Blaster · Nikhil Math</title>
  <meta name="description" content="My resume, as a help desk game. Send each request to the skill that fixes it before the SLA runs out, and unlock my IT career one level at a time.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Resume Blaster · Nikhil Math">
  <meta property="og:description" content="My resume, as a help desk game. Send each request to the skill that fixes it before the SLA runs out.">
  <meta property="og:url" content="https://nikhilmath.com/resume-blaster">
  <meta property="og:image" content="https://nikhilmath.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Resume Blaster · Nikhil Math">
  <meta name="twitter:description" content="My resume, as a help desk game. Send each request to the skill that fixes it before the SLA runs out.">
  <meta name="twitter:image" content="https://nikhilmath.com/og-image.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f14'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='36' font-weight='700' fill='%23ffb86c'%3E%26gt;_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #e6edf3;
      --body: #cbd5de;
      --muted: #8b949e;
      --accent: #ffb86c;
      --danger: #ff7b72;
      --window-bg: rgba(17, 22, 29, 0.86);
      --titlebar: rgba(48, 52, 60, 0.85);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #1a1310;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(circle at 20% 25%, #c47240 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, #964a20 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, #d89364 0%, transparent 50%),
        radial-gradient(circle at 25% 90%, #6b3416 0%, transparent 45%);
      filter: blur(90px) saturate(90%);
      z-index: 0;
      animation: drift 30s ease-in-out infinite alternate;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-4%, 3%) scale(1.08); }
    }

    .window {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
      border-radius: 12px;
      background: var(--window-bg);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      border: 1px solid var(--border);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      position: relative;
      padding: 10px 14px;
      background: var(--titlebar);
      border-bottom: 1px solid var(--border);
    }
    .chrome { display: flex; gap: 8px; }
    .chrome span {
      width: 12px; height: 12px; border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.35);
    }
    .chrome span:nth-child(1) { background: #ff5f57; }
    .chrome span:nth-child(2) { background: #febc2e; }
    .chrome span:nth-child(3) { background: #28c840; }
    .titlebar .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 16px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
    }
    .hud .v { color: var(--text); }
    .hud .lives { color: var(--accent); letter-spacing: 2px; }

    .body { padding: 14px; }

    .stage {
      position: relative;
      min-height: 540px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0b0f14;
    }

    /* ---- The help desk ---- */

    .desk {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 540px;
      padding: 16px;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .bar .streak { color: var(--accent); }

    .sla {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .sla-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: background 200ms ease;
    }
    .sla-fill.low { background: var(--danger); }

    .ticket {
      padding: 16px 18px 14px 18px;
      border: 1px solid rgba(255, 184, 108, 0.4);
      border-radius: 10px;
      background: rgba(255, 184, 108, 0.08);
    }
    .ticket-meta { margin: 0 0 8px 0; font-size: 12px; color: var(--muted); }
    .ticket-meta .from { color: var(--accent); }
    .ticket-text {
      margin: 0;
      min-height: 2.9em;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.45;
    }
    .ticket-note {
      margin: 8px 0 0 0;
      min-height: 1.4em;
      font-size: 12px;
      color: var(--danger);
    }
    .ticket.enter { animation: enter 260ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .ticket.resolved { animation: resolved 420ms ease forwards; }
    .ticket.wrong {
      border-color: var(--danger);
      background: rgba(255, 123, 114, 0.1);
      animation: shake 320ms ease;
    }
    @keyframes enter { from { transform: translateY(-14px); opacity: 0; } }
    @keyframes resolved { to { transform: scale(0.94); opacity: 0.15; } }
    @keyframes shake {
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .route { margin: 2px 0 0 0; font-size: 12px; color: var(--muted); }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .tool {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      text-align: left;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }
    .tool:hover:not(:disabled) { border-color: var(--accent); background: rgba(255, 184, 108, 0.08); }
    .tool:active:not(:disabled) { transform: translateY(1px); }
    .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tool .key {
      flex: none;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }
    .tool .check { margin-left: auto; color: var(--accent); }
    .tool:disabled { cursor: default; opacity: 0.35; }
    .tool.correct { opacity: 1; border-color: var(--accent); background: rgba(255, 184, 108, 0.22); }
    .tool.wrong { opacity: 1; border-color: var(--danger); background: rgba(255, 123, 114, 0.18); }
    .tool.reveal {
      opacity: 1;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255, 184, 108, 0.5);
      animation: pulse 500ms ease 3;
    }
    @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255, 184, 108, 0.25); } }

    .fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ---- Overlays ---- */

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      padding: 20px;
      overflow-y: auto;
      background: rgba(9, 12, 16, 0.9);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none; }
    .panel { width: 100%; max-width: 440px; margin: auto; }

    .panel .kicker { margin: 0 0 8px 0; color: var(--accent); font-size: 12px; }
    .panel h1 { margin: 0 0 14px 0; font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
    .panel h2 { margin: 0 0 6px 0; font-size: 24px; font-weight: 600; }
    .panel .role { margin: 0 0 16px 0; color: var(--accent); font-size: 14px; }
    .panel p { margin: 0 0 14px 0; color: var(--body); font-size: 13px; line-height: 1.7; }

    .howto {
      list-style: none;
      padding: 12px 14px;
      margin: 0 0 18px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px 0; }
    .chips span {
      padding: 5px 10px;
      border: 1px solid rgba(255, 184, 108, 0.35);
      border-radius: 999px;
      background: rgba(255, 184, 108, 0.07);
      color: var(--accent);
      font-size: 12px;
    }

    .entry {
      padding: 14px 16px;
      margin: 0 0 10px 0;
      border: 1px solid rgba(255, 184, 108, 0.32);
      border-radius: 8px;
      background: rgba(255, 184, 108, 0.07);
    }
    .entry h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .entry .meta { margin: 4px 0 0 0; color: var(--accent); font-size: 12px; }
    .entry ul {
      margin: 10px 0 0 0;
      padding-left: 18px;
      color: var(--body);
      font-size: 12px;
      line-height: 1.7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 0 16px 0;
    }
    .stats div {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
    }
    .stats span { display: block; color: var(--muted); font-size: 11px; }
    .stats b { display: block; margin-top: 4px; font-size: 16px; color: var(--accent); }

    .contact {
      list-style: none;
      padding: 0;
      margin: 0 0 18px 0;
      display: grid;
      gap: 6px;
      font-size: 13px;
    }
    .contact a { color: var(--text); text-decoration: none; }
    .contact a:hover { color: var(--accent); }
    .contact span { display: inline-block; min-width: 80px; color: var(--muted); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .btn {
      display: inline-block;
      font: inherit;
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a1310;
      font-weight: 600;
    }
    .btn.primary:hover { background: #ffc98c; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .below {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .below a { color: var(--muted); text-decoration: none; white-space: nowrap; }
    .below a:hover { color: var(--accent); }
    .below .hint { text-align: center; }
    .below .resume-link { color: var(--accent); }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .titlebar .title { display: none; }
      .body { padding: 10px; }
      .hud { padding: 8px 12px; font-size: 11px; }
      .below .hint { display: none; }
      .desk { padding: 12px; }
      .ticket-text { font-size: 17px; }
      .tool { font-size: 13px; padding: 10px; }
      .tool .key { display: none; }
      .panel h1 { font-size: 26px; }
      .overlay { padding: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      .ticket.enter, .ticket.resolved, .ticket.wrong, .tool.reveal { animation: none; }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="titlebar">
      <div class="chrome"><span></span><span></span><span></span></div>
      <div class="title">nikhil@math — resume-blaster</div>
    </div>
    <div class="hud">
      <span id="hudLevel" class="v">lvl 1 · kimberbell</span>
      <span>score <span id="hudScore" class="v">000000</span></span>
      <span>uptime <span id="hudLives" class="lives">■■■</span></span>
    </div>
    <div class="body">
      <div class="stage" id="stage">
        <div class="desk">
          <div class="bar">
            <span id="progress">request 1 of 5</span>
            <span id="streak" class="streak"></span>
          </div>
          <div class="sla" aria-hidden="true"><div class="sla-fill" id="slaFill"></div></div>
          <article class="ticket" id="ticket" aria-live="polite">
            <p class="ticket-meta"><span id="ticketId">#0000</span> · from <span id="ticketFrom" class="from">the help desk</span></p>
            <p class="ticket-text" id="ticketText">Waiting for the first request…</p>
            <p class="ticket-note" id="ticketNote"></p>
          </article>
          <p class="route">route it to the skill that fixes it:</p>
          <div class="tools" id="tools"></div>
        </div>
        <canvas class="fx" id="fx" aria-hidden="true"></canvas>
        <div class="overlay" id="overlay" hidden></div>
      </div>
      <div class="below">
        <a href="/">&larr; nikhilmath.com</a>
        <span class="hint" id="hint"></span>
        <a class="resume-link" href="/resume/" target="_blank" rel="noopener">my resume &#8599;</a>
      </div>
    </div>
  </main>

  <script>
  (() => {
    "use strict";

    // ---- Resume content unlocked by each level ------------------------------------

    const ENTRIES = {
      kimberbellDev: {
        title: "Web Developer / IT Specialist",
        org: "Kimberbell (promoted to IT Manager)",
        dates: "Mar 2022 – Feb 2023",
        bullets: [
          "Built accessible (WCAG), responsive e-commerce websites and supported Windows and macOS users on-site",
        ],
      },
      kimberbellMgr: {
        title: "IT Manager",
        org: "Kimberbell",
        dates: "Feb 2023 – Oct 2023",
        bullets: [
          "Led a team of web developers and IT specialists, providing direction and final technical decisions",
          "Oversaw the critical business systems and websites used by 120+ employees",
          "Upgraded, troubleshot, and supported Windows and macOS computer systems on-site",
        ],
      },
      visionaryDevices: {
        title: "IT Support Manager",
        org: "Visionary Homes",
        dates: "Oct 2023 – Present",
        bullets: [
          "Administer Jamf and Apple Business Manager to enroll, configure, and manage 100+ macOS, iOS, and iPadOS devices",
          "Manage the full device lifecycle for macOS, iOS, iPadOS, and Windows devices, from provisioning and deployment to support and retirement",
          "Standardized the company’s mobile carrier account and phone system, and documented both so they are consistent and easy to support",
          "Provide help desk support and manage IT hardware inventory",
        ],
      },
      visionaryOps: {
        title: "IT Support Manager",
        org: "Visionary Homes",
        dates: "Oct 2023 – Present",
        bullets: [
          "Lead IT for 100+ employees and manage the company’s third-party IT services provider as its main point of contact",
          "Built an onboarding matrix covering 75+ job titles, each with its own custom process, that automates Asana to populate onboarding and offboarding checklists",
          "Serve as project manager for IT initiatives in Asana, including company-wide hardware rollouts",
          "Write clear, well-structured IT documentation and internal wikis in Markdown, and train staff in troubleshooting and self-service",
        ],
      },
      certs: {
        title: "Certifications",
        org: "CompTIA · PeopleCert",
        dates: "2025 – 2026",
        bullets: [
          "CompTIA A+ (Jan 2026)",
          "ITIL 4 Foundation – IT Service Management (May 2025)",
        ],
      },
    };

    // ---- Levels -------------------------------------------------------------------
    // Each level's toolbox is the skills from that job. Every skill fixes exactly one
    // request, so nothing repeats. `sla` is the seconds allowed for the first request;
    // each request after it gets 5% less.

    const LEVELS = [
      {
        hud: "lvl 1 · kimberbell", year: "2022", org: "Kimberbell", role: "Web Developer / IT Specialist",
        sla: 10, unlocks: ["kimberbellDev"],
        tickets: [
          { from: "Marketing", text: "Screen readers can't describe our product photos.", skill: "WCAG Accessibility" },
          { from: "Sales", text: "The online store breaks on phones.", skill: "Responsive Design" },
          { from: "Customer Care", text: "Discount codes stopped working at checkout.", skill: "E-commerce" },
          { from: "Design", text: "My Mac won't connect to the office printer.", skill: "macOS Support" },
          { from: "Accounting", text: "A Windows update froze my PC at 30%.", skill: "Windows Support" },
        ],
      },
      {
        hud: "lvl 2 · kimberbell", year: "2023", org: "Kimberbell", role: "IT Manager",
        sla: 8.5, unlocks: ["kimberbellMgr"],
        tickets: [
          { from: "Web Team", text: "We need a final call on which platform to build on.", skill: "Team Leadership" },
          { from: "Operations", text: "The main website is down and orders have stopped.", skill: "Incident Management" },
          { from: "HR", text: "Nobody knows how to reset their own password.", skill: "Staff Training" },
          { from: "Finance", text: "Half our workstations are too old for the new software.", skill: "System Upgrades" },
          { from: "Shipping", text: "My laptop keeps crashing. Can someone take a look?", skill: "Help Desk Support" },
        ],
      },
      {
        hud: "lvl 3 · visionary homes", year: "2023 – now", org: "Visionary Homes", role: "IT Support Manager · devices",
        sla: 7.5, unlocks: ["visionaryDevices"],
        tickets: [
          { from: "Sales", text: "Push the new Wi-Fi settings to every company Mac.", skill: "Jamf" },
          { from: "Purchasing", text: "New iPhones should set themselves up out of the box.", skill: "Apple Business Manager" },
          { from: "Construction", text: "This 5-year-old laptop is due to be retired.", skill: "Device Lifecycle" },
          { from: "Accounting", text: "Which laptops do we own, and who has them?", skill: "IT Asset Management" },
          { from: "Finance", text: "The carrier bill has phone lines nobody uses.", skill: "Phone & Carrier Accounts" },
          { from: "Sales", text: "A buyer's self-guided tour door won't unlock.", skill: "NterNow" },
        ],
      },
      {
        hud: "lvl 4 · visionary homes", year: "2023 – now", org: "Visionary Homes", role: "IT Support Manager · operations",
        sla: 6.5, unlocks: ["visionaryOps", "certs"],
        tickets: [
          { from: "HR", text: "A new superintendent starts Monday. Get them set up.", skill: "Onboarding & Offboarding" },
          { from: "Leadership", text: "Plan and track the company-wide laptop rollout.", skill: "Asana" },
          { from: "Office Manager", text: "Our outside IT provider keeps missing deadlines.", skill: "Vendor & MSP Management" },
          { from: "Everyone", text: "Where are the instructions for the conference room TV?", skill: "Technical Writing" },
          { from: "Security", text: "Scan our cloud accounts for misconfigurations.", skill: "Prowler" },
          { from: "IT", text: "Every request needs a priority, an owner and a deadline.", skill: "ITSM" },
          { from: "Operations", text: "The same checklist gets rebuilt by hand every week.", skill: "Workflow Automation" },
        ],
      },
    ];
    const TOTAL = LEVELS.reduce((n, L) => n + L.tickets.length, 0);

    // ---- DOM -----------------------------------------------------------------------

    const $ = id => document.getElementById(id);
    const stage = $("stage");
    const overlay = $("overlay");
    const ticketEl = $("ticket");
    const toolsEl = $("tools");
    const slaFill = $("slaFill");
    const fx = $("fx");
    const fctx = fx.getContext("2d");
    const hud = { level: $("hudLevel"), score: $("hudScore"), lives: $("hudLives") };

    const coarse = window.matchMedia("(pointer: coarse)").matches;
    $("hint").textContent = coarse ? "tap the skill that fixes it" : "click a skill or press its number · P pauses";

    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    const shuffle = arr => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    // ---- State ---------------------------------------------------------------------

    let state = "title"; // title | intro | playing | paused | clear | over | won
    let levelIndex = 0;
    let score = 0;
    let levelStartScore = 0;
    let lives = 3;
    let queue = [];
    let current = null;
    let used = new Set();
    let slaTotal = 0;
    let slaLeft = 0;
    let locked = false;
    let advanceIn = 0;
    let streak = 0;
    let bestStreak = 0;
    let correctTotal = 0;
    let levelCorrect = 0;
    let particles = [];
    let beams = [];
    let floaters = [];

    // ---- Game flow -----------------------------------------------------------------

    function newGame() {
      score = 0;
      correctTotal = 0;
      bestStreak = 0;
      showIntro(0);
    }

    function showIntro(i) {
      levelIndex = i;
      lives = 3;
      levelStartScore = score;
      state = "intro";
      idleDesk();
      updateHud();
      showOverlay("intro");
    }

    function beginLevel() {
      queue = shuffle(LEVELS[levelIndex].tickets);
      used = new Set();
      streak = 0;
      levelCorrect = 0;
      lives = 3;
      hideOverlay();
      state = "playing";
      updateHud();
      nextTicket();
    }

    function nextTicket() {
      const L = LEVELS[levelIndex];
      if (!queue.length) {
        state = "clear";
        showOverlay("clear");
        return;
      }
      current = queue.shift();
      const index = L.tickets.length - queue.length - 1;
      slaTotal = L.sla * Math.pow(0.95, index);
      slaLeft = slaTotal;
      locked = false;
      advanceIn = 0;

      $("progress").textContent = `request ${index + 1} of ${L.tickets.length}`;
      $("ticketId").textContent = `#${1000 + Math.floor(Math.random() * 9000)}`;
      $("ticketFrom").textContent = current.from;
      $("ticketText").textContent = current.text;
      $("ticketNote").textContent = "";
      ticketEl.className = "ticket";
      void ticketEl.offsetWidth;
      ticketEl.classList.add("enter");
      renderTools();
    }

    function renderTools(disabledAll = false) {
      const skills = shuffle(LEVELS[levelIndex].tickets.map(t => t.skill));
      toolsEl.innerHTML = skills.map((s, i) => {
        const done = used.has(s);
        return `<button type="button" class="tool" data-skill="${esc(s)}"${done || disabledAll ? " disabled" : ""}>` +
          `<span class="key">${i + 1}</span><span class="name">${esc(s)}</span>` +
          `${done ? '<span class="check">&#10003;</span>' : ""}</button>`;
      }).join("");
    }

    // The desk behind the level intro: the toolbox is visible but inactive.
    function idleDesk() {
      const L = LEVELS[levelIndex];
      used = new Set();
      $("progress").textContent = `request 1 of ${L.tickets.length}`;
      $("streak").textContent = "";
      $("ticketId").textContent = "#0000";
      $("ticketFrom").textContent = L.org;
      $("ticketText").textContent = "Waiting for the first request…";
      $("ticketNote").textContent = "";
      ticketEl.className = "ticket";
      slaFill.style.width = "100%";
      slaFill.classList.remove("low");
      renderTools(true);
    }

    function toolFor(skill) {
      return [...toolsEl.querySelectorAll(".tool")].find(b => b.dataset.skill === skill);
    }

    function answer(btn) {
      if (state !== "playing" || locked || !btn || btn.disabled) return;
      locked = true;
      used.add(current.skill);
      if (btn.dataset.skill === current.skill) {
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        correctTotal++;
        levelCorrect++;
        const mult = Math.min(4, 1 + Math.floor(streak / 2));
        const pts = Math.round((100 + slaLeft * 25) * mult);
        score += pts;
        btn.classList.add("correct");
        ticketEl.classList.add("resolved");
        blast(btn, mult > 1 ? `+${pts} · x${mult}` : `+${pts}`);
        $("streak").textContent = streak > 1 ? `streak ${streak} · x${mult}` : "";
        advanceIn = 0.6;
        updateHud();
      } else {
        miss(`Wrong skill. That was ${current.skill}.`, btn);
      }
    }

    function miss(message, btn) {
      streak = 0;
      lives--;
      $("streak").textContent = "";
      $("ticketNote").textContent = message;
      ticketEl.classList.remove("enter");
      ticketEl.classList.add("wrong");
      if (btn) {
        btn.classList.add("wrong");
        burstAt(btn, 12, "#ff7b72");
      }
      const right = toolFor(current.skill);
      if (right) right.classList.add("reveal");
      advanceIn = 1.6;
      updateHud();
    }

    function advance() {
      if (lives <= 0) {
        state = "over";
        showOverlay("over");
        return;
      }
      nextTicket();
    }

    function pause() {
      if (state !== "playing") return;
      state = "paused";
      showOverlay("paused");
    }

    function nextLevel() {
      if (levelIndex + 1 < LEVELS.length) showIntro(levelIndex + 1);
      else { state = "won"; showOverlay("won"); }
    }

    // ---- Effects: a blaster bolt from the chosen skill to the request ---------------------

    function center(el) {
      const s = stage.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
    }

    function blast(btn, label) {
      const a = center(btn);
      const b = center(ticketEl);
      beams.push({ x0: a.x, y0: a.y, x1: b.x, y1: b.y, t: 0, label, hit: false });
    }

    function burst(x, y, n, color) {
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 260;
        const life = 0.35 + Math.random() * 0.45;
        particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life, max: life, color, size: 2 + Math.random() * 3 });
      }
    }

    function burstAt(el, n, color) {
      const c = center(el);
      burst(c.x, c.y, n, color);
    }

    function stepFx(dt) {
      for (const b of beams) {
        b.t += dt;
        if (!b.hit && b.t >= 0.12) {
          b.hit = true;
          burst(b.x1, b.y1, 34, "#ffb86c");
          burst(b.x1, b.y1, 10, "#ffffff");
          floaters.push({ x: b.x1, y: b.y1 - 20, text: b.label, life: 1 });
        }
      }
      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 1 - 3 * dt;
        p.vy *= 1 - 3 * dt;
        p.life -= dt;
      }
      for (const f of floaters) { f.y -= 34 * dt; f.life -= dt; }
      beams = beams.filter(b => b.t < 0.3);
      particles = particles.filter(p => p.life > 0);
      floaters = floaters.filter(f => f.life > 0);
    }

    function drawFx() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = stage.clientWidth, h = stage.clientHeight;
      if (fx.width !== Math.round(w * dpr) || fx.height !== Math.round(h * dpr)) {
        fx.width = Math.round(w * dpr);
        fx.height = Math.round(h * dpr);
      }
      fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fctx.clearRect(0, 0, w, h);

      for (const b of beams) {
        const head = Math.min(1, b.t / 0.12);
        const tail = Math.min(1, Math.max(0, (b.t - 0.06) / 0.2));
        const hx = b.x0 + (b.x1 - b.x0) * head, hy = b.y0 + (b.y1 - b.y0) * head;
        const tx = b.x0 + (b.x1 - b.x0) * tail, ty = b.y0 + (b.y1 - b.y0) * tail;
        fctx.globalAlpha = b.t > 0.12 ? Math.max(0, 1 - (b.t - 0.12) / 0.18) : 1;
        fctx.lineCap = "round";
        fctx.strokeStyle = "#ffb86c";
        fctx.lineWidth = 7;
        fctx.shadowColor = "#ffb86c";
        fctx.shadowBlur = 16;
        fctx.beginPath();
        fctx.moveTo(tx, ty);
        fctx.lineTo(hx, hy);
        fctx.stroke();
        fctx.shadowBlur = 0;
        fctx.strokeStyle = "#ffffff";
        fctx.lineWidth = 2;
        fctx.stroke();
      }
      for (const p of particles) {
        fctx.globalAlpha = Math.max(0, p.life / p.max);
        fctx.fillStyle = p.color;
        fctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      fctx.font = '600 14px "JetBrains Mono", ui-monospace, Menlo, monospace';
      fctx.textAlign = "center";
      for (const f of floaters) {
        fctx.globalAlpha = Math.min(1, f.life * 2);
        fctx.fillStyle = "#ffb86c";
        fctx.fillText(f.text, f.x, f.y);
      }
      fctx.globalAlpha = 1;
    }

    // ---- Overlays --------------------------------------------------------------------

    function entryHtml(id) {
      const e = ENTRIES[id];
      return `<div class="entry"><h3>${e.title}</h3><p class="meta">${e.org} · ${e.dates}</p>` +
        `<ul>${e.bullets.map(b => `<li>${b}</li>`).join("")}</ul></div>`;
    }

    const CONTACT = `
      <ul class="contact">
        <li><span>email</span><a href="mailto:erulemath@gmail.com">erulemath@gmail.com</a></li>
        <li><span>phone</span><a href="tel:+14359194041">+1 435 919 4041</a></li>
        <li><span>linkedin</span><a href="https://www.linkedin.com/in/nikhil-math/" target="_blank" rel="noopener">nikhil-math</a></li>
      </ul>`;

    const OVERLAYS = {
      title: () => `
        <div class="panel">
          <p class="kicker">~ nikhil@math:$ ./resume-blaster</p>
          <h1>Resume Blaster</h1>
          <p>My resume, as a help desk shift. Requests come in fast. Send each one to the skill that fixes it before the SLA runs out, and every level you clear unlocks the next chapter of my IT career.</p>
          <ul class="howto">
            <li>${coarse ? "tap" : "click, or press the number of"} the skill that fixes each request</li>
            <li>every skill is used exactly once per level</li>
            <li>a wrong answer or a missed SLA costs uptime</li>
            <li>4 levels · ${TOTAL} requests · about 2 minutes</li>
          </ul>
          <div class="actions">
            <button class="btn primary" data-action="start">start shift &rarr;</button>
            <a class="btn" href="/resume/">just show me the resume</a>
          </div>
        </div>`,

      intro: () => {
        const L = LEVELS[levelIndex];
        return `
          <div class="panel">
            <p class="kicker">level ${levelIndex + 1} of ${LEVELS.length} · ${L.year}</p>
            <h2>${L.org}</h2>
            <p class="role">${L.role}</p>
            <p>${L.tickets.length} requests, starting at ${L.sla} seconds each. Your toolbox for this level:</p>
            <div class="chips">${L.tickets.map(t => `<span>${esc(t.skill)}</span>`).join("")}</div>
            <div class="actions">
              <button class="btn primary" data-action="begin">start level &rarr;</button>
            </div>
          </div>`;
      },

      paused: () => `
        <div class="panel">
          <p class="kicker">level ${levelIndex + 1} · paused</p>
          <h2>Out to lunch.</h2>
          <p>The queue will wait. Probably.</p>
          <div class="actions">
            <button class="btn primary" data-action="continue">back to the desk &rarr;</button>
          </div>
        </div>`,

      clear: () => {
        const L = LEVELS[levelIndex];
        const last = levelIndex === LEVELS.length - 1;
        return `
          <div class="panel">
            <p class="kicker">level ${levelIndex + 1} cleared · ${levelCorrect} of ${L.tickets.length} right · score ${score}</p>
            <h2>Unlocked</h2>
            ${L.unlocks.map(entryHtml).join("")}
            <div class="actions">
              <button class="btn primary" data-action="next">${last ? "finish shift" : `level ${levelIndex + 2}`} &rarr;</button>
            </div>
          </div>`;
      },

      over: () => `
        <div class="panel">
          <p class="kicker">level ${levelIndex + 1} · uptime 0%</p>
          <h2>SLA breached.</h2>
          <p>The queue got away from you. It happens to the best of us, usually on a Monday.</p>
          <div class="actions">
            <button class="btn primary" data-action="retry">retry level &rarr;</button>
            <a class="btn" href="/resume/">view my resume</a>
          </div>
        </div>`,

      won: () => `
        <div class="panel">
          <p class="kicker">shift complete</p>
          <h2>You made it to the present day.</h2>
          <div class="stats">
            <div><span>score</span><b>${score}</b></div>
            <div><span>right</span><b>${correctTotal}/${TOTAL}</b></div>
            <div><span>best streak</span><b>${bestStreak}</b></div>
          </div>
          <p>Thanks for playing. If you'd like to talk, here's where to find me.</p>
          ${CONTACT}
          <div class="actions">
            <a class="btn primary" href="/resume/">view my resume</a>
            <button class="btn" data-action="start">play again</button>
          </div>
        </div>`,
    };

    function showOverlay(kind) {
      overlay.innerHTML = OVERLAYS[kind]();
      overlay.hidden = false;
      overlay.scrollTop = 0;
      const primary = overlay.querySelector(".btn.primary");
      if (primary) primary.focus({ preventScroll: true });
    }

    function hideOverlay() {
      overlay.hidden = true;
      overlay.innerHTML = "";
    }

    function updateHud() {
      hud.level.textContent = LEVELS[levelIndex].hud;
      hud.score.textContent = String(score).padStart(6, "0");
      hud.lives.textContent = "■".repeat(Math.max(0, lives)) + "□".repeat(Math.max(0, 3 - lives));
    }

    // ---- Input -----------------------------------------------------------------------

    overlay.addEventListener("click", e => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === "start") newGame();
      else if (action === "begin") beginLevel();
      else if (action === "next") nextLevel();
      else if (action === "retry") { score = levelStartScore; beginLevel(); }
      else if (action === "continue") { hideOverlay(); state = "playing"; }
    });

    toolsEl.addEventListener("click", e => answer(e.target.closest(".tool")));

    window.addEventListener("keydown", e => {
      if (state === "playing") {
        if (e.key === "p" || e.key === "P" || e.key === "Escape") { pause(); return; }
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 9) answer(toolsEl.querySelectorAll(".tool")[n - 1]);
      } else if (state === "paused" && (e.key === "p" || e.key === "P")) {
        hideOverlay();
        state = "playing";
      }
    });
    window.addEventListener("blur", pause);
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

    // ---- Loop -------------------------------------------------------------------------

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (state === "playing") {
        if (advanceIn > 0) {
          advanceIn -= dt;
          if (advanceIn <= 0) advance();
        } else if (!locked) {
          slaLeft -= dt;
          if (slaLeft <= 0) {
            slaLeft = 0;
            locked = true;
            used.add(current.skill);
            miss(`SLA breached. That was ${current.skill}.`, null);
          }
        }
        const pct = slaTotal ? Math.max(0, slaLeft / slaTotal) : 1;
        slaFill.style.width = `${pct * 100}%`;
        slaFill.classList.toggle("low", pct < 0.3);
      }
      stepFx(dt);
      drawFx();
      requestAnimationFrame(frame);
    }

    idleDesk();
    updateHud();
    showOverlay("title");
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
