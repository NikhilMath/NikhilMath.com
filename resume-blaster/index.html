<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f14'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='36' font-weight='700' fill='%23ffb86c'%3E%26gt;_%3C/text%3E%3C/svg%3E">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #ffb86c;
      --danger: #ff7b72;
      --window-bg: rgba(17, 22, 29, 0.86);
      --titlebar: rgba(48, 52, 60, 0.85);
      --titlebar-border: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #1a1310;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(circle at 20% 25%, #c47240 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, #964a20 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, #d89364 0%, transparent 50%),
        radial-gradient(circle at 25% 90%, #6b3416 0%, transparent 45%);
      filter: blur(90px) saturate(90%);
      z-index: 0;
      animation: drift 30s ease-in-out infinite alternate;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-4%, 3%) scale(1.08); }
    }

    .window {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      background: var(--window-bg);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      border: 1px solid var(--border);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      position: relative;
      padding: 10px 14px;
      background: var(--titlebar);
      border-bottom: 1px solid var(--titlebar-border);
    }
    .chrome { display: flex; gap: 8px; }
    .chrome span {
      width: 12px; height: 12px; border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.35);
    }
    .chrome span:nth-child(1) { background: #ff5f57; }
    .chrome span:nth-child(2) { background: #febc2e; }
    .chrome span:nth-child(3) { background: #28c840; }
    .titlebar .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 16px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
    }
    .hud .v { color: var(--text); }
    .hud .lives { color: var(--accent); letter-spacing: 2px; }

    .body { padding: 14px; }
    .fit { width: 100%; }

    .stage {
      position: relative;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0b0f14;
    }
    canvas { display: block; touch-action: none; cursor: crosshair; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      padding: 20px;
      overflow-y: auto;
      background: rgba(9, 12, 16, 0.84);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      touch-action: pan-y;
    }
    .overlay[hidden] { display: none; }
    .panel { width: 100%; max-width: 400px; margin: auto; }
    .panel.wide { max-width: 480px; }

    .panel .kicker {
      margin: 0 0 8px 0;
      color: var(--accent);
      font-size: 12px;
    }
    .panel h1 {
      margin: 0 0 14px 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .panel h2 {
      margin: 0 0 14px 0;
      font-size: 20px;
      font-weight: 600;
    }
    .panel p {
      margin: 0 0 14px 0;
      color: #cbd5de;
      font-size: 13px;
      line-height: 1.7;
    }
    .howto {
      list-style: none;
      padding: 12px 14px;
      margin: 0 0 18px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }
    .howto b { color: var(--accent); font-weight: 600; }

    .entry {
      padding: 14px 16px;
      margin: 0 0 10px 0;
      border: 1px solid rgba(255, 184, 108, 0.32);
      border-radius: 8px;
      background: rgba(255, 184, 108, 0.07);
    }
    .entry h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .entry .meta { margin: 4px 0 0 0; color: var(--accent); font-size: 12px; line-height: 1.5; }
    .entry ul {
      margin: 10px 0 0 0;
      padding-left: 18px;
      color: #cbd5de;
      font-size: 12px;
      line-height: 1.7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 0 16px 0;
    }
    .stats div {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
    }
    .stats span { display: block; color: var(--muted); font-size: 11px; }
    .stats b { display: block; margin-top: 4px; font-size: 16px; color: var(--accent); }

    .contact {
      list-style: none;
      padding: 0;
      margin: 0 0 18px 0;
      display: grid;
      gap: 6px;
      font-size: 13px;
    }
    .contact a { color: var(--text); text-decoration: none; }
    .contact a:hover { color: var(--accent); }
    .contact span { color: var(--muted); display: inline-block; min-width: 80px; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .btn {
      font: inherit;
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }
    a.btn { display: inline-block; text-decoration: none; }
    .btn:hover { border-color: var(--accent); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a1310;
      font-weight: 600;
    }
    .btn.primary:hover { background: #ffc98c; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .resume h2 {
      margin: 22px 0 10px 0;
      padding-bottom: 6px;
      font-size: 13px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
    }
    .resume .name { margin: 0; font-size: 24px; font-weight: 600; }
    .resume .headline { margin: 4px 0 14px 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .resume .skills { margin: 0; font-size: 12px; line-height: 1.7; color: #cbd5de; }
    .resume .skills dt { color: var(--text); font-weight: 600; margin-top: 8px; }
    .resume .skills dd { margin: 0; }
    .resume .certs { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.7; color: #cbd5de; }

    .below {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .below a { color: var(--muted); text-decoration: none; white-space: nowrap; }
    .below .hint { text-align: center; }
    .below a:hover { color: var(--accent); }
    .linkish {
      font: inherit;
      font-size: 12px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }
    .linkish:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .titlebar .title { display: none; }
      .body { padding: 10px; }
      .hud { padding: 8px 12px; font-size: 11px; }
      .below .hint { display: none; }
      .panel h1 { font-size: 26px; }
      .overlay { padding: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="titlebar">
      <div class="chrome"><span></span><span></span><span></span></div>
      <div class="title">nikhil@math — resume-blaster</div>
    </div>
    <div class="hud">
      <span id="hudLevel" class="v">lvl 1 · devpoint labs</span>
      <span>score <span id="hudScore" class="v">000000</span></span>
      <span>uptime <span id="hudLives" class="lives">■■■</span></span>
    </div>
    <div class="body">
      <div class="fit" id="fit">
        <div class="stage" id="stage">
          <canvas id="game" aria-label="Resume Blaster game area"></canvas>
          <div class="overlay" id="overlay" aria-live="polite" hidden></div>
        </div>
      </div>
      <div class="below">
        <a href="/">&larr; nikhilmath.com</a>
        <span class="hint" id="hint"></span>
        <button class="linkish" id="skipBtn" type="button">skip to resume</button>
      </div>
    </div>
  </main>

  <script>
  (() => {
    "use strict";

    const W = 420;
    const H = 620;
    const SLA_Y = H - 84;
    const BANNER_TIME = 5.4; // how long the job title stays up at the start of a level
    const FONT = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
    const C = {
      text: "#e6edf3",
      muted: "#8b949e",
      accent: "#ffb86c",
      danger: "#ff7b72",
      bg: "#0b0f14",
    };

    // ---- Resume content -------------------------------------------------

    const RESUME = {
      name: "Nikhil Math",
      headline: "IT Support Manager · CompTIA A+ · ITIL 4 · Jamf & Apple Device Management",
      summary: "CompTIA A+ and ITIL 4 certified IT Support Manager with 4+ years of IT experience supporting 100+ employees on macOS, iOS, iPadOS, and Windows. Manage a third-party IT services provider, lead IT projects in Asana, and standardize systems and processes company-wide. Skilled in Jamf, Apple Business Manager, vendor management, device lifecycle management, onboarding and offboarding, and technical documentation. Previously led an in-house IT and web team.",
      certifications: [
        "CompTIA A+ (Jan 2026)",
        "ITIL 4 Foundation – IT Service Management, PeopleCert (May 2025)",
      ],
      skills: [
        ["IT Operations", "IT Project Management (Asana), Workflow Automation, Vendor & MSP Management, IT Service Management (ITSM), Incident Management, Help Desk Support, Device Lifecycle Management, Employee Onboarding & Offboarding, IT Asset Management, Phone System & Mobile Account Management, Technical Writing (Markdown), End-User Training"],
        ["Platforms & Tools", "Jamf, Apple Business Manager, Mobile Device Management (MDM), Asana, macOS, iOS, iPadOS, Windows, NterNow, Prowler (cloud security scanning)"],
        ["Leadership", "Team Leadership, Staff Training, Public Relations, Public Speaking"],
      ],
      experience: ["visionary", "kimberbellMgr", "kimberbellDev", "sunplex"],
      board: ["recovery"],
      education: ["usu", "devpoint"],
    };

    const ENTRIES = {
      visionary: {
        title: "IT Support Manager",
        org: "Visionary Homes",
        dates: "Oct 2023 – Present",
        bullets: [
          "Lead IT for 100+ employees and manage the company’s third-party IT services provider as its main point of contact",
          "Built an onboarding matrix covering 75+ job titles, each with its own custom process, that automates Asana to populate onboarding and offboarding checklists",
          "Standardized the company’s mobile carrier account and phone system, and documented both so they are consistent and easy to support",
          "Serve as project manager for IT initiatives in Asana, including company-wide hardware rollouts",
          "Administer Jamf and Apple Business Manager to enroll, configure, and manage 100+ macOS, iOS, and iPadOS devices",
          "Manage the full device lifecycle for macOS, iOS, iPadOS, and Windows devices, from provisioning and deployment to support and retirement",
          "Write clear, well-structured IT documentation and internal wikis in Markdown, and train staff in troubleshooting and self-service",
          "Provide help desk support and manage IT hardware inventory",
        ],
      },
      certs: {
        title: "Certifications",
        org: "CompTIA · PeopleCert",
        dates: "2025 – 2026",
        bullets: [
          "CompTIA A+ (Jan 2026)",
          "ITIL 4 Foundation – IT Service Management (May 2025)",
        ],
      },
      kimberbellMgr: {
        title: "IT Manager",
        org: "Kimberbell",
        dates: "Feb 2023 – Oct 2023",
        bullets: [
          "Led a team of web developers and IT specialists, providing direction and final technical decisions",
          "Oversaw the critical business systems and websites used by 120+ employees",
          "Upgraded, troubleshot, and supported Windows and macOS computer systems on-site",
        ],
      },
      kimberbellDev: {
        title: "Web Developer / IT Specialist",
        org: "Kimberbell (promoted to IT Manager)",
        dates: "Mar 2022 – Feb 2023",
        bullets: [
          "Built accessible (WCAG), responsive e-commerce websites and supported Windows and macOS users on-site",
        ],
      },
      sunplex: {
        title: "Property Owner & Manager",
        org: "SunPlex Properties",
        dates: "Aug 2016 – Present",
        bullets: [
          "Own and manage a 4-unit apartment property, including tenant screening and legally compliant leases",
        ],
      },
      recovery: {
        title: "Board of Directors, Head of Public Relations",
        org: "Recovery Cafe (nonprofit)",
        dates: "Oct 2023 – Present",
        bullets: [
          "Represent the nonprofit at community events; as Board Secretary (2023–2024), chaired meetings and kept records",
        ],
      },
      usu: {
        title: "Associate’s Degree",
        org: "Utah State University",
        dates: "Dec 2024",
        bullets: [
          "Secured $240K in accessibility funding through independent advocacy; elected to USU Fee Board (nearly 30K students)",
        ],
      },
      devpoint: {
        title: "Certificate, Full-Stack Web Development (Ruby on Rails, React.js)",
        org: "DevPoint Labs",
        dates: "Feb 2021",
        bullets: [],
      },
    };

    // ---- Levels -----------------------------------------------------------

    const LEVELS = [
      {
        name: "level 1", hud: "lvl 1 · devpoint labs",
        banner: ["LEVEL 1 · 2021", "DevPoint Labs", "the training arc"],
        entries: ["devpoint"],
        quota: 12, hp: 4, speed: 33, every: 1.3, shooter: 0, tough: 0,
        tickets: ["syntax error", "missing ;", "merge conflict", "undefined", "N+1 query", "404", "CORS", "db:migrate"],
      },
      {
        name: "level 2", hud: "lvl 2 · kimberbell",
        banner: ["LEVEL 2 · 2022", "Kimberbell", "web developer / IT specialist"],
        entries: ["kimberbellDev"],
        quota: 14, hp: 5, speed: 38, every: 1.4, shooter: 0.2, tough: 0.12,
        tickets: ["WCAG fail", "alt text?", "slow page", "broken cart", "mobile layout", "low contrast", "Mac won't boot", "PC on-site"],
      },
      {
        name: "level 3", hud: "lvl 3 · kimberbell",
        banner: ["LEVEL 3 · 2023", "Kimberbell", "promoted: IT manager"],
        entries: ["kimberbellMgr"],
        quota: 16, hp: 5, speed: 42, every: 1.3, shooter: 0.28, tough: 0.22,
        tickets: ["site down", "code review", "final call", "Windows update", "macOS upgrade", "vendor call", "120+ users", "critical system"],
      },
      {
        name: "level 4", hud: "lvl 4 · visionary homes",
        banner: ["LEVEL 4 · 2023 – NOW", "Visionary Homes", "IT support manager"],
        entries: ["visionary", "certs"],
        quota: 18, hp: 6, speed: 44, every: 1.5, shooter: 0.3, tough: 0.22,
        tickets: ["printer driver", "password reset", "new hire", "offboarding", "MSP ticket", "carrier bill", "iPad enroll", "Jamf policy", "hardware rollout", "wiki update"],
        boss: {
          name: "ONBOARDING MATRIX",
          banner: ["BOSS", "The Onboarding Matrix", "75+ job titles, one process each"],
          hp: 80,
          minions: ["new hire", "offboarding", "role change", "checklist"],
        },
      },
      {
        name: "bonus level", hud: "bonus · side quests",
        banner: ["BONUS LEVEL", "Side Quests", "nonprofit board, school, property"],
        entries: ["recovery", "usu", "sunplex"],
        quota: 14, hp: 5, speed: 40, every: 1.35, shooter: 0.22, tough: 0.18,
        tickets: ["board meeting", "minutes", "community event", "fee board vote", "accessibility", "tenant screening", "lease renewal", "leaky faucet"],
      },
    ];

    // Skills that drop as pickups. The three in POWER also grant a power-up.
    const POWER = {
      "CompTIA A+": { key: "spread", label: "spread shot", time: 9 },
      "Jamf": { key: "rapid", label: "rapid fire", time: 9 },
      "ITIL 4": { key: "shield", label: "shield up", time: 12 },
    };
    const SKILLS = [
      "Asana", "Apple Business Manager", "MDM", "macOS", "iOS", "iPadOS", "Windows",
      "Workflow Automation", "Vendor & MSP Mgmt", "ITSM", "Incident Mgmt", "Help Desk",
      "Device Lifecycle", "Onboarding", "Asset Mgmt", "Tech Writing", "End-User Training",
      "Team Leadership", "Public Speaking", "Public Relations", "Prowler", "NterNow",
    ];

    // ---- DOM ------------------------------------------------------------------

    const $ = id => document.getElementById(id);
    const canvas = $("game");
    const ctx = canvas.getContext("2d");
    const fit = $("fit");
    const stage = $("stage");
    const overlay = $("overlay");
    const hud = { level: $("hudLevel"), score: $("hudScore"), lives: $("hudLives") };

    const coarse = window.matchMedia("(pointer: coarse)").matches;
    $("hint").textContent = coarse ? "drag to move · auto-fire" : "← → or mouse to move · auto-fire · P pauses";

    // ---- State ----------------------------------------------------------------

    let scale = 1;
    let state = "title"; // title | playing | paused | clear | over | won | resume
    let resumeReturn = "title";
    let levelIndex = 0;
    let score = 0;
    let levelStartScore = 0;
    let lives = 3;
    let totalResolved = 0;
    let spawned = 0;
    let handled = 0;
    let spawnTimer = 0;
    let banner = null;
    let bannerTimer = 0;
    let clearing = false;
    let clearTimer = 0;
    let shake = 0;
    let time = 0;
    let boss = null;
    let bossDone = false;
    let bullets = [], shots = [], tickets = [], pickups = [], particles = [], floaters = [];
    const skillsFound = new Set();
    let skillCursor = 0;
    const keys = Object.create(null);
    let pointerX = null;
    const player = { x: W / 2, y: H - 46, w: 32, h: 24, cooldown: 0, invuln: 0, spread: 0, rapid: 0, shield: 0 };

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    const playerRect = () => ({ x: player.x - player.w / 2 + 4, y: player.y - player.h / 2 + 2, w: player.w - 8, h: player.h - 4 });
    const ticketRect = t => ({ x: t.x + Math.sin(t.age * 1.7 + t.phase) * t.sway, y: t.y, w: t.w, h: t.h });

    // ---- Game flow --------------------------------------------------------------

    function newGame() {
      score = 0;
      totalResolved = 0;
      skillsFound.clear();
      skillCursor = 0;
      startLevel(0);
    }

    function startLevel(i) {
      levelIndex = i;
      bullets = []; shots = []; tickets = []; pickups = []; particles = []; floaters = [];
      boss = null;
      bossDone = false;
      spawned = 0;
      handled = 0;
      spawnTimer = 1.0;
      clearing = false;
      shake = 0;
      lives = 3;
      levelStartScore = score;
      Object.assign(player, { x: W / 2, cooldown: 0.4, invuln: 0, spread: 0, rapid: 0, shield: 0 });
      showBanner(LEVELS[i].banner);
      hideOverlay();
      state = "playing";
      updateHud();
    }

    function showBanner(lines) {
      banner = lines;
      bannerTimer = BANNER_TIME;
    }

    function pause() {
      if (state !== "playing") return;
      state = "paused";
      showOverlay("paused");
    }

    function openResume() {
      if (state === "resume") return;
      if (state === "playing") state = "paused";
      resumeReturn = state;
      state = "resume";
      showOverlay("resume");
    }

    function closeResume() {
      state = resumeReturn;
      showOverlay(state);
    }

    function nextLevel() {
      if (levelIndex + 1 < LEVELS.length) startLevel(levelIndex + 1);
      else { state = "won"; showOverlay("won"); }
    }

    // ---- Spawning ---------------------------------------------------------------

    function spawnTicket(L, opts = {}) {
      ctx.font = `600 13px ${FONT}`;
      const label = opts.label || pick(L.tickets);
      const w = Math.ceil(ctx.measureText(label).width) + 26;
      const h = 36;
      const sway = opts.minion ? rand(0, 8) : rand(0, 16);
      const minX = 8 + sway;
      const maxX = W - w - 8 - sway;
      const x = opts.x != null ? opts.x - w / 2 : rand(minX, maxX);
      const tough = opts.tough ?? Math.random() < L.tough;
      tickets.push({
        label, w, h, sway,
        x: clamp(x, minX, maxX),
        y: opts.y ?? -h,
        vy: (opts.speed || L.speed) * rand(0.85, 1.15),
        phase: rand(0, Math.PI * 2),
        hp: opts.hp ?? L.hp + (tough ? 3 : 0),
        maxHp: opts.hp ?? L.hp + (tough ? 3 : 0),
        tough,
        shooter: opts.shooter ?? Math.random() < L.shooter,
        fire: rand(1.2, 2.6),
        age: 0,
        flash: 0,
        minion: !!opts.minion,
      });
    }

    function spawnBoss(def) {
      boss = { ...def, x: W / 2 - 95, y: -110, w: 190, h: 96, maxHp: def.hp, t: 0, fire: 2, spawn: 3, flash: 0 };
      showBanner(def.banner);
    }

    function dropPickup(x, y) {
      let label;
      if (Math.random() < 0.5) label = pick(Object.keys(POWER));
      else label = SKILLS[skillCursor++ % SKILLS.length];
      ctx.font = `600 11px ${FONT}`;
      const w = Math.ceil(ctx.measureText(label).width) + 18;
      pickups.push({ label, x: clamp(x - w / 2, 6, W - w - 6), y, w, h: 20, vy: 95 });
    }

    // ---- Hits ------------------------------------------------------------------

    function hitTicket(t, r, bx) {
      t.hp--;
      t.flash = 0.06;
      // Spark where the shot lands, below the label, so the text stays readable.
      if (t.hp > 0) { burst(bx, r.y + r.h, 4, C.accent); return; }
      t.dead = true;
      if (!t.minion) handled++;
      totalResolved++;
      const pts = t.tough ? 150 : 100;
      score += pts;
      burst(r.x + r.w / 2, r.y + r.h / 2, 14, C.accent);
      float(r.x + r.w / 2, r.y, `+${pts}`, C.accent);
      if (Math.random() < 0.17) dropPickup(r.x + r.w / 2, r.y + r.h / 2);
      updateHud();
    }

    function hitBoss() {
      boss.hp--;
      boss.flash = 0.08;
      score += 10;
      if (boss.hp <= 0) {
        const cx = boss.x + boss.w / 2, cy = boss.y + boss.h / 2;
        burst(cx, cy, 70, C.accent);
        burst(cx, cy, 30, C.danger);
        float(cx, cy, "+2000 · matrix automated", C.accent);
        score += 2000;
        boss = null;
        bossDone = true;
        shake = 0.5;
        shots = [];
        for (const t of tickets) {
          if (!t.minion) continue;
          const r = ticketRect(t);
          t.dead = true;
          burst(r.x + r.w / 2, r.y + r.h / 2, 10, C.accent);
        }
      }
      updateHud();
    }

    function hitPlayer() {
      if (player.invuln > 0) return;
      if (player.shield > 0) {
        player.shield = 0;
        player.invuln = 0.6;
        float(player.x, player.y - 30, "shield absorbed it", C.accent);
        burst(player.x, player.y, 12, C.accent);
        return;
      }
      loseLife("reply-all hit you", player.x, player.y - 30);
    }

    function loseLife(msg, x, y) {
      lives--;
      player.invuln = 1.4;
      shake = 0.35;
      float(x, y, msg, C.danger);
      burst(x, y + 10, 14, C.danger);
      updateHud();
      if (lives <= 0) {
        state = "over";
        showOverlay("over");
      }
    }

    function collect(p) {
      skillsFound.add(p.label);
      const pw = POWER[p.label];
      if (pw) {
        player[pw.key] = pw.time;
        float(player.x, player.y - 34, `${p.label} · ${pw.label}`, C.accent);
      } else {
        score += 250;
        float(player.x, player.y - 34, `+250 · ${p.label}`, C.text);
      }
      updateHud();
    }

    // ---- Effects -----------------------------------------------------------------

    function burst(x, y, n, color) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2);
        const s = rand(40, 210);
        const life = rand(0.35, 0.8);
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: rand(1.5, 3.5) });
      }
    }

    function float(x, y, text, color) {
      floaters.push({ x: clamp(x, 70, W - 70), y, text, color, life: 1.2 });
    }

    function stepFx(dt) {
      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 1 - 3 * dt;
        p.vy *= 1 - 3 * dt;
        p.life -= dt;
      }
      for (const f of floaters) { f.y -= 30 * dt; f.life -= dt; }
      particles = particles.filter(p => p.life > 0);
      floaters = floaters.filter(f => f.life > 0);
    }

    // ---- Update -----------------------------------------------------------------

    function update(dt) {
      time += dt;
      const L = LEVELS[levelIndex];
      if (bannerTimer > 0) bannerTimer -= dt;
      if (shake > 0) shake -= dt;

      // Player movement: keyboard wins over pointer while held.
      const dir = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
      if (dir) {
        pointerX = null;
        player.x += dir * 330 * dt;
      } else if (pointerX != null) {
        player.x += clamp(pointerX - player.x, -540 * dt, 540 * dt);
      }
      player.x = clamp(player.x, player.w / 2 + 6, W - player.w / 2 - 6);
      for (const k of ["invuln", "spread", "rapid", "shield"]) {
        if (player[k] > 0) player[k] = Math.max(0, player[k] - dt);
      }

      // Auto-fire.
      player.cooldown -= dt;
      if (player.cooldown <= 0) {
        player.cooldown = player.rapid > 0 ? 0.09 : 0.18;
        const y = player.y - player.h / 2 - 6;
        bullets.push({ x: player.x - 1.5, y, w: 3, h: 11, vx: 0 });
        if (player.spread > 0) {
          bullets.push({ x: player.x - 1.5, y, w: 3, h: 11, vx: -150 });
          bullets.push({ x: player.x - 1.5, y, w: 3, h: 11, vx: 150 });
        }
      }

      // Spawning: the level's ticket quota, then the boss if there is one.
      if (spawned < L.quota) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTicket(L);
          spawned++;
          spawnTimer = L.every * rand(0.7, 1.25);
        }
      } else if (L.boss && !boss && !bossDone && tickets.length === 0) {
        spawnBoss(L.boss);
      }

      // Tickets.
      for (const t of tickets) {
        t.age += dt;
        t.y += t.vy * dt;
        if (t.flash > 0) t.flash -= dt;
        if (t.shooter && t.y > 10 && t.y < SLA_Y - 170) {
          t.fire -= dt;
          if (t.fire <= 0) {
            t.fire = rand(1.8, 3.2);
            const r = ticketRect(t);
            shots.push({ x: r.x + r.w / 2 - 3, y: r.y + r.h, w: 6, h: 10, vx: 0, vy: 215 });
          }
        }
        if (t.y + t.h >= SLA_Y) {
          t.dead = true;
          if (!t.minion) handled++;
          const r = ticketRect(t);
          loseLife("SLA breached", r.x + r.w / 2, SLA_Y - 16);
          if (state !== "playing") return;
        }
      }

      // Boss.
      if (boss) {
        const b = boss;
        b.t += dt;
        if (b.flash > 0) b.flash -= dt;
        if (b.y < 64) {
          b.y = Math.min(64, b.y + 70 * dt);
        } else {
          b.x = W / 2 - b.w / 2 + Math.sin(b.t * 0.9) * (W / 2 - b.w / 2 - 10);
          b.fire -= dt;
          if (b.fire <= 0) {
            b.fire = b.hp < b.maxHp / 2 ? 1.1 : 1.6;
            const cx = b.x + b.w / 2;
            for (const vx of [-90, 0, 90]) shots.push({ x: cx - 3, y: b.y + b.h, w: 6, h: 10, vx, vy: 200 });
          }
          b.spawn -= dt;
          if (b.spawn <= 0) {
            b.spawn = rand(2.6, 3.6);
            spawnTicket(L, {
              label: pick(b.minions), x: b.x + b.w / 2, y: b.y + b.h - 6,
              minion: true, shooter: false, tough: false, speed: 50, hp: 3,
            });
          }
        }
      }

      // Player bullets.
      for (const bl of bullets) {
        bl.x += bl.vx * dt;
        bl.y -= 620 * dt;
        if (bl.y + bl.h < 0 || bl.x < -10 || bl.x > W + 10) { bl.dead = true; continue; }
        for (const t of tickets) {
          if (t.dead) continue;
          const r = ticketRect(t);
          if (overlaps(bl, r)) { bl.dead = true; hitTicket(t, r, bl.x); break; }
        }
        if (!bl.dead && boss && overlaps(bl, boss)) { bl.dead = true; hitBoss(); }
      }

      // Enemy shots.
      const pr = playerRect();
      for (const s of shots) {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        if (s.y > H || s.x < -10 || s.x > W + 10) { s.dead = true; continue; }
        if (overlaps(s, pr)) {
          s.dead = true;
          hitPlayer();
          if (state !== "playing") return;
        }
      }

      // Pickups.
      for (const p of pickups) {
        p.y += p.vy * dt;
        if (p.y > H) p.dead = true;
        else if (overlaps(p, pr)) { p.dead = true; collect(p); }
      }

      stepFx(dt);
      bullets = bullets.filter(o => !o.dead);
      shots = shots.filter(o => !o.dead);
      tickets = tickets.filter(o => !o.dead);
      pickups = pickups.filter(o => !o.dead);

      // Level clear once the queue is empty (and the boss is down).
      if (!clearing && handled >= L.quota && tickets.length === 0 && (!L.boss || bossDone)) {
        clearing = true;
        clearTimer = 1.1;
        shots = [];
      }
      if (clearing) {
        clearTimer -= dt;
        if (clearTimer <= 0) {
          clearing = false;
          state = "clear";
          showOverlay("clear");
        }
      }
    }

    // ---- Draw -------------------------------------------------------------------

    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);

      // Scrolling grid.
      ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 30) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
      const off = (time * 18) % 30;
      for (let y = off - 30; y <= H; y += 30) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
      ctx.stroke();

      if (shake > 0) ctx.translate(rand(-5, 5) * shake, rand(-5, 5) * shake);

      // SLA line.
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(255, 123, 114, 0.45)";
      ctx.beginPath();
      ctx.moveTo(0, SLA_Y + 0.5);
      ctx.lineTo(W, SLA_Y + 0.5);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = `10px ${FONT}`;
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillStyle = "rgba(255, 123, 114, 0.75)";
      ctx.fillText("SLA", W - 8, SLA_Y - 4);

      // Tickets.
      ctx.font = `600 13px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const t of tickets) {
        const r = ticketRect(t);
        const tough = t.tough;
        const hitNow = t.flash > 0;
        const jolt = hitNow ? (Math.random() - 0.5) * 2 : 0;
        const x = r.x + jolt;
        rr(x, r.y, r.w, r.h, 6);
        ctx.fillStyle = tough ? "rgba(255, 123, 114, 0.16)" : "rgba(255, 184, 108, 0.13)";
        ctx.fill();
        ctx.strokeStyle = hitNow ? "#ffffff" : tough ? "rgba(255, 123, 114, 0.85)" : "rgba(255, 184, 108, 0.6)";
        ctx.lineWidth = hitNow || tough ? 2 : 1;
        ctx.stroke();
        ctx.fillStyle = C.text;
        ctx.fillText(t.label, x + r.w / 2, r.y + r.h / 2 - 3);

        // Health bar along the bottom of the ticket.
        const barW = r.w - 14;
        ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
        ctx.fillRect(x + 7, r.y + r.h - 8, barW, 3);
        ctx.fillStyle = tough ? C.danger : C.accent;
        ctx.fillRect(x + 7, r.y + r.h - 8, barW * Math.max(0, t.hp) / t.maxHp, 3);
        if (t.shooter) {
          ctx.fillStyle = C.danger;
          ctx.beginPath();
          ctx.arc(x + 7, r.y + 7, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Boss.
      if (boss) {
        const b = boss;
        rr(b.x, b.y, b.w, b.h, 8);
        ctx.fillStyle = b.flash > 0 ? "rgba(255, 255, 255, 0.3)" : "rgba(255, 123, 114, 0.14)";
        ctx.fill();
        ctx.strokeStyle = C.danger;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const cols = 8, rows = 3, pad = 12, top = b.y + 30;
        const cw = (b.w - pad * 2) / cols;
        const ch = (b.h - 40) / rows;
        const tick = Math.floor(b.t * 4);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const lit = (c * 7 + r * 3 + tick) % 5 === 0;
            ctx.fillStyle = lit ? "rgba(255, 184, 108, 0.85)" : "rgba(255, 255, 255, 0.12)";
            ctx.fillRect(b.x + pad + c * cw + 2, top + r * ch + 2, cw - 4, ch - 4);
          }
        }
        ctx.font = `600 12px ${FONT}`;
        ctx.fillStyle = C.text;
        ctx.fillText(b.name, b.x + b.w / 2, b.y + 16);

        const bw = W - 40;
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        ctx.fillRect(20, 14, bw, 6);
        ctx.fillStyle = C.danger;
        ctx.fillRect(20, 14, bw * Math.max(0, b.hp) / b.maxHp, 6);
      }

      // Pickups.
      ctx.font = `600 11px ${FONT}`;
      for (const p of pickups) {
        const pulse = 0.75 + Math.sin(time * 8) * 0.25;
        rr(p.x, p.y, p.w, p.h, 10);
        ctx.fillStyle = POWER[p.label] ? `rgba(255, 184, 108, ${pulse})` : `rgba(230, 237, 243, ${pulse * 0.9})`;
        ctx.fill();
        ctx.fillStyle = "#1a1310";
        ctx.fillText(p.label, p.x + p.w / 2, p.y + p.h / 2 + 1);
      }

      // Bullets and enemy shots.
      ctx.fillStyle = C.accent;
      for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = C.danger;
      for (const s of shots) { rr(s.x, s.y, s.w, s.h, 3); ctx.fill(); }

      drawPlayer();

      // Particles and floating text.
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.font = `600 11px ${FONT}`;
      for (const f of floaters) {
        ctx.globalAlpha = Math.min(1, f.life * 2);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;

      // Queue counter and active power-ups.
      if (state === "playing" || state === "paused") {
        const L = LEVELS[levelIndex];
        ctx.font = `11px ${FONT}`;
        ctx.textBaseline = "top";
        if (!boss) {
          ctx.textAlign = "right";
          ctx.fillStyle = C.muted;
          ctx.fillText(`queue ${Math.max(0, L.quota - handled)}`, W - 10, 10);
        }
        const active = [];
        if (player.spread > 0) active.push(`spread ${Math.ceil(player.spread)}s`);
        if (player.rapid > 0) active.push(`rapid ${Math.ceil(player.rapid)}s`);
        if (player.shield > 0) active.push("shield");
        if (active.length) {
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          ctx.fillStyle = C.accent;
          ctx.fillText(active.join("  "), 10, H - 8);
        }
      }

      // Level / boss banner.
      if (banner && bannerTimer > 0 && state === "playing") {
        const a = Math.min(1, bannerTimer / 0.5, (BANNER_TIME - bannerTimer) / 0.3);
        const y = H * 0.4;
        ctx.globalAlpha = Math.max(0, a);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = C.accent;
        ctx.font = `600 12px ${FONT}`;
        ctx.fillText(banner[0], W / 2, y);
        ctx.fillStyle = C.text;
        ctx.font = `600 24px ${FONT}`;
        ctx.fillText(banner[1], W / 2, y + 32);
        ctx.fillStyle = C.muted;
        ctx.font = `12px ${FONT}`;
        ctx.fillText(banner[2], W / 2, y + 62);
        ctx.globalAlpha = 1;
      }
    }

    function drawPlayer() {
      if (player.invuln > 0 && Math.floor(time * 16) % 2 === 0) return;
      const { x, y } = player;
      ctx.save();
      ctx.translate(x, y);
      if (player.shield > 0) {
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 184, 108, 0.1)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 184, 108, 0.75)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // Thruster flicker.
      ctx.fillStyle = `rgba(255, 123, 114, ${0.5 + Math.random() * 0.4})`;
      ctx.fillRect(-3, 10, 6, 4 + Math.random() * 5);
      // Ship: an upward caret.
      ctx.beginPath();
      ctx.moveTo(0, -13);
      ctx.lineTo(16, 11);
      ctx.lineTo(0, 4);
      ctx.lineTo(-16, 11);
      ctx.closePath();
      ctx.fillStyle = C.accent;
      ctx.fill();
      // Blinking cursor on the hull.
      if (Math.floor(time * 2) % 2 === 0) {
        ctx.fillStyle = "#1a1310";
        ctx.fillRect(-3, -3, 6, 2);
      }
      ctx.restore();
    }

    // ---- Overlays ---------------------------------------------------------------

    function entryHtml(id) {
      const e = ENTRIES[id];
      const bullets = e.bullets.length ? `<ul>${e.bullets.map(b => `<li>${b}</li>`).join("")}</ul>` : "";
      return `<div class="entry"><h3>${e.title}</h3><p class="meta">${e.org} · ${e.dates}</p>${bullets}</div>`;
    }

    function contactHtml() {
      return `
        <ul class="contact">
          <li><span>email</span><a href="mailto:erulemath@gmail.com">erulemath@gmail.com</a></li>
          <li><span>phone</span><a href="tel:+14359194041">+1 435 919 4041</a></li>
          <li><span>linkedin</span><a href="https://www.linkedin.com/in/nikhil-math/" target="_blank" rel="noopener">nikhil-math</a></li>
          <li><span>website</span><a href="/">nikhilmath.com</a></li>
        </ul>`;
    }

    const OVERLAYS = {
      title: () => `
        <div class="panel">
          <p class="kicker">~ nikhil@math:$ ./resume-blaster</p>
          <h1>Resume Blaster</h1>

          <ul class="howto">

          </ul>
          <div class="actions">

            <button class="btn" data-action="resume">just show me the resume</button>
            <a class="btn" href="/resume-blaster/trailer/">&#9654; watch the trailer</a>
          </div>
        </div>`,

      paused: () => `
        <div class="panel">
          <p class="kicker">${LEVELS[levelIndex].name} · paused</p>
          <h2>Out to lunch.</h2>
          <p>The tickets will wait. Probably.</p>
          <div class="actions">
            <button class="btn primary" data-action="continue">keep playing &rarr;</button>
            <button class="btn" data-action="resume">view resume</button>
          </div>
        </div>`,

      clear: () => {
        const L = LEVELS[levelIndex];
        const next = LEVELS[levelIndex + 1];
        return `
          <div class="panel">
            <p class="kicker">${L.name} cleared · score ${score}</p>
            <h2>Unlocked</h2>
            ${L.entries.map(entryHtml).join("")}

              <button class="btn primary" data-action="next">${next ? `${next.name} &rarr;` : "finish &rarr;"}</button>
            </div>
          </div>`;
      },

      over: () => `
        <div class="panel">
          <p class="kicker">${LEVELS[levelIndex].name} · uptime 0%</p>
          <h2>SLA breached.</h2>
          <p>The ticket queue got away from you. It happens to the best of us, usually on a Monday.</p>
          <div class="actions">

          <p class="headline">${RESUME.headline}</p>
          ${contactHtml()}
          <h2>summary</h2>
          <p>${RESUME.summary}</p>
          <h2>certifications</h2>
          <ul class="certs">${RESUME.certifications.map(c => `<li>${c}</li>`).join("")}</ul>
          <h2>skills</h2>
          <dl class="skills">${RESUME.skills.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
          <h2>experience</h2>
          ${RESUME.experience.map(entryHtml).join("")}
          <h2>board leadership</h2>
          ${RESUME.board.map(entryHtml).join("")}
          <h2>education</h2>
          ${RESUME.education.map(entryHtml).join("")}
          <div class="actions">
            <button class="btn primary" data-action="back">&larr; ${resumeReturn === "paused" ? "back to the game" : "back"}</button>
          </div>
        </div>`,
    };

    function showOverlay(kind) {
      overlay.innerHTML = OVERLAYS[kind]();
      overlay.hidden = false;
      overlay.scrollTop = 0;
      const primary = overlay.querySelector(".btn.primary");
      if (primary) primary.focus({ preventScroll: true });
    }

    function hideOverlay() {
      overlay.hidden = true;
      overlay.innerHTML = "";
    }

    function updateHud() {
      hud.level.textContent = LEVELS[levelIndex].hud;
      hud.score.textContent = String(score).padStart(6, "0");
      hud.lives.textContent = "■".repeat(Math.max(0, lives)) + "□".repeat(Math.max(0, 3 - lives));
    }

    // ---- Input ------------------------------------------------------------------

    overlay.addEventListener("click", e => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === "start") newGame();
      else if (action === "next") nextLevel();
      else if (action === "retry") { score = levelStartScore; startLevel(levelIndex); }
      else if (action === "continue") { hideOverlay(); state = "playing"; }
      else if (action === "resume") openResume();
      else if (action === "back") closeResume();
    });

    $("skipBtn").addEventListener("click", openResume);

    const keyName = e => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
    window.addEventListener("keydown", e => {
      const k = keyName(e);
      if (state === "playing") {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(k)) e.preventDefault();
        if (k === "p" || k === "Escape") { pause(); return; }
      } else if (state === "paused" && k === "p") {
        hideOverlay();
        state = "playing";
        return;
      }
      keys[k] = true;
    });
    window.addEventListener("keyup", e => { keys[keyName(e)] = false; });
    window.addEventListener("blur", () => {
      for (const k in keys) keys[k] = false;
      pause();
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

    const toLogicalX = e => {
      const r = canvas.getBoundingClientRect();
      return (e.clientX - r.left) / r.width * W;
    };
    canvas.addEventListener("pointerdown", e => {
      pointerX = toLogicalX(e);
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", e => { pointerX = toLogicalX(e); });

    // ---- Layout & loop ------------------------------------------------------------

    function resize() {
      const avail = fit.clientWidth;
      const maxH = Math.max(360, window.innerHeight - 210);
      let w = Math.min(avail, W * 1.35);
      let h = w * H / W;
      if (h > maxH) { h = maxH; w = h * W / H; }
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      stage.style.width = `${w}px`;
      stage.style.height = `${h}px`;
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      scale = (w / W) * dpr;
    }
    window.addEventListener("resize", resize);

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state === "playing") update(dt);
      else if (state === "title" || state === "clear" || state === "won") { time += dt; stepFx(dt); }
      draw();
      requestAnimationFrame(frame);
    }

    resize();
    updateHud();
    showOverlay("title");
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
