  <style>
    :root {
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #ffb86c;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.playing { cursor: none; }

    canvas { display: block; }

    .ui {
      position: fixed;
      inset: 0;
      display: flex;
      padding: 20px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .ui[hidden] { display: none; }

    .panel {
      margin: auto;
      width: 100%;
      max-width: 460px;
      padding: 26px 26px 22px 26px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(17, 22, 29, 0.9);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    }
    .kicker { margin: 0 0 8px 0; color: var(--accent); font-size: 12px; }
    h1 { margin: 0 0 6px 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    .sub { margin: 0 0 20px 0; color: var(--muted); font-size: 13px; }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 0 0 18px 0;
    }
    .seg button {
      font: inherit;
      font-size: 12px;
      padding: 10px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(255, 184, 108, 0.12);
      color: var(--accent);
    }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      font: inherit;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a1310;
      font-weight: 700;
    }
    .btn.primary:hover { background: #ffc98c; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .note {
      margin: 16px 0 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .note:empty { display: none; }
    #dl:not(:empty) { margin-top: 12px; }

    .links {
      margin: 20px 0 0 0;
      padding-top: 14px;

      font-size: 12px;
      color: var(--muted);
    }
    .links a { color: var(--muted); text-decoration: none; }
    .links a:hover { color: var(--accent); }
  </style>

<body>
  <canvas id="c" aria-label="Resume Blaster trailer"></canvas>

  <div class="ui" id="ui">
    <div class="panel">
      <p class="kicker">~ nikhil@math:$ ./resume-blaster --trailer</p>
      <h1 id="uiTitle">Resume Blaster</h1>
      <p class="sub" id="uiSub">The trailer · 56 seconds · sound on</p>
      <div class="seg" role="group" aria-label="Video format">
        <button type="button" data-format="h" aria-pressed="true">16:9 · LinkedIn, YouTube</button>
        <button type="button" data-format="v" aria-pressed="false">9:16 · vertical</button>
      </div>
      <div class="actions">
        <button class="btn primary" id="playBtn" type="button">&#9654; play</button>
        <button class="btn" id="recBtn" type="button">&#9679; record video</button>
      </div>
      <p class="note" id="note"></p>
      <div id="dl"></div>
      <p class="links"><a href="/resume-blaster/">play the game</a> · <a href="/">nikhilmath.com</a></p>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const DURATION = 56;
    const FONT = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
    const C = {
      bg: "#0a0d12",
      text: "#f2f5f8",
      muted: "#9aa4ae",
      accent: "#ffb86c",
      coral: "#ff7b72",
    };

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const ui = document.getElementById("ui");
    const note = document.getElementById("note");
    const dl = document.getElementById("dl");
    const playBtn = document.getElementById("playBtn");
    const recBtn = document.getElementById("recBtn");

    let format = new URLSearchParams(location.search).get("format") === "vertical" ? "v" : "h";
    let W = 1920;
    let H = 1080;

    // Pick the value for the current format: F(horizontal, vertical).
    const F = (h, v) => (format === "h" ? h : v);
    const val = v => (Array.isArray(v) ? F(v[0], v[1]) : v);

    const clamp01 = x => Math.max(0, Math.min(1, x));
    const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
    const easeOutExpo = p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
    const easeInCubic = p => p * p * p;
    const easeOutBack = p => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
    };
    function mulberry32(seed) {
      return () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const avatar = new Image();
    avatar.src = "/avatar.jpg";

    // ---- Timeline -------------------------------------------------------------
    // Every beat of the video is data. Times are seconds on a 120 BPM grid
    // (one beat = 0.5s, one bar = 2s) so cuts land on the music.

    const EL = [];      // single text elements
    const WORDS = [];   // lines that pop in word by word and wrap per format
    const HITS = [];    // impacts: particles, flash, shake and a boom in the music
    const LASERS = [];  // blaster bolts that land on an impact
    const AVATARS = [];
    const WIPES = [4, 10, 18, 26, 34, 48];

    const el = o => EL.push(o);
    const words = o => WORDS.push(o);
    const laser = (t, fy) => LASERS.push({ t, fy });
    const hit = (t, fy, o = {}) => HITS.push({
      t, fy,
      n: o.n ?? 40,
      power: o.power ?? 1,
      flash: o.flash ?? 0.3,
      shake: o.shake ?? 0.6,
      ring: !!o.ring,
      seed: Math.round(t * 1000) + 17,
    });

    // 1. Title card, 0–4s
    el({ text: "RESUME", t0: 0, t1: 1.7, fy: [0.40, 0.41], size: 240, weight: 800, anim: "slam" });
    el({ text: "BLASTER", t0: 0.5, t1: 1.7, fy: [0.60, 0.54], size: 240, weight: 800, color: C.accent, anim: "slam", glow: true });
    hit(0, [0.40, 0.41], { n: 50, flash: 0.8, shake: 0.9, ring: true });
    laser(0.5, [0.60, 0.54]);
    hit(0.5, [0.60, 0.54], { n: 120, flash: 0.6, shake: 1.2, ring: true, power: 1.3 });
    AVATARS.push({ t0: 2, t1: 3.7, fy: [0.28, 0.33], size: [230, 320] });
    el({ text: "NIKHIL MATH", t0: 2, t1: 3.7, fy: [0.56, 0.49], size: 150, weight: 800, anim: "slam" });
    el({ text: "IT Support Manager", t0: 2.5, t1: 3.7, fy: [0.69, 0.56], size: 60, weight: 700, color: C.accent, anim: "slide" });
    hit(2, [0.56, 0.49], { n: 30, flash: 0.2, shake: 0.5 });

    // 2. Who I am, 4–10s
    el({ text: "4+ YEARS IN IT", t0: 4, t1: 9.6, fy: [0.30, 0.36], size: 44, weight: 700, color: C.accent, anim: "slide", track: 8 });
    words({
      fy: [0.53, 0.5], size: [104, 92], weight: 800, t1: 9.6,
      words: [
        { w: "I", t0: 4.5 },
        { w: "keep", t0: 4.75 },
        { w: "100+", t0: 5, color: C.accent, anim: "slam" },
        { w: "employees", t0: 5.5 },
        { w: "up", t0: 6, br: true },
        { w: "and", t0: 6.25 },
        { w: "running.", t0: 6.5 },
      ],
    });
    hit(5, [0.47, 0.44], { n: 40, flash: 0.25, shake: 0.6 });

    // 3. Experience blasts, 10–34s. One result per screen, never more than ~8 words.
    const BLASTS = [
      { b: 10, n: "01", title: "IT MANAGER", org: "Kimberbell", tag: "IT & web team lead",
        num: "120+", phrase: ["employees", "on", "systems", "I", "oversaw."] },
      { b: 18, n: "02", title: "IT SUPPORT MANAGER", org: "Visionary Homes", tag: "Oct 2023 – present",
        num: "75+", phrase: ["job", "titles.", "Onboarding,", "automated."] },
      { b: 26, n: "03", title: "IT SUPPORT MANAGER", org: "Visionary Homes", tag: "Apple device management",
        num: "100+", phrase: ["Apple", "devices,", "managed", "in", "Jamf."] },
    ];
    for (const B of BLASTS) {
      const b = B.b;
      el({ text: `${B.n} / 03`, t0: b, t1: b + 7.6, fy: [0.14, 0.22], size: 40, weight: 700, color: C.accent, anim: "slide", track: 6 });
      el({ text: B.title, t0: b + 0.5, t1: b + 3.5, fy: [0.44, 0.44], size: 140, weight: 800, anim: "slam" });
      el({ text: B.org, t0: b + 1, t1: b + 3.5, fy: [0.58, 0.52], size: 70, weight: 700, color: C.accent, anim: "slide", dir: 1 });
      el({ text: B.tag, t0: b + 1.5, t1: b + 3.5, fy: [0.68, 0.58], size: 44, weight: 600, color: C.muted, anim: "pop" });
      hit(b + 0.5, [0.44, 0.44], { n: 24, flash: 0.15, shake: 0.5 });

      el({ text: B.org, t0: b + 3.75, t1: b + 7.6, fy: [0.26, 0.30], size: 48, weight: 700, color: C.muted, anim: "slide", track: 2 });
      laser(b + 4, [0.48, 0.43]);
      el({ text: B.num, t0: b + 4, t1: b + 7.6, fy: [0.48, 0.43], size: [360, 280], weight: 800, color: C.accent, anim: "slam", glow: true });
      hit(b + 4, [0.48, 0.43], { n: 90, flash: 0.45, shake: 1, ring: true, power: 1.2 });
      words({
        fy: [0.73, 0.6], size: [72, 88], weight: 700, t1: b + 7.6,
        words: B.phrase.map((w, k) => ({ w, t0: b + 4.5 + k * 0.25 })),
      });
    }

    // 4. Skills rapid-fire, 34–41s
    const SKILLS = ["Jamf", "Apple Business Manager", "CompTIA A+", "ITIL 4", "Asana", "Vendor & MSP Management", "Device Lifecycle"];
    el({ text: "THE TOOLKIT", t0: 34, t1: 40.6, fy: [0.2, 0.3], size: 44, weight: 700, color: C.accent, anim: "slide", track: 10 });
    SKILLS.forEach((s, i) => {
      const t = 34 + i;
      el({ text: s, t0: t, t1: t + 0.78, fy: [0.52, 0.5], size: 150, weight: 800, anim: "fly", dir: i % 2 ? -1 : 1, exit: 0.2, color: i % 2 ? C.accent : C.text });
      el({ text: `0${i + 1} / 0${SKILLS.length}`, t0: t, t1: t + 0.78, fy: [0.7, 0.6], size: 36, weight: 700, color: C.muted, anim: "pop", exit: 0.15 });
      hit(t + 0.12, [0.52, 0.5], { n: 22, flash: 0.08, shake: 0.35 });
    });

    // 5. Highlight, 41–48s: the blaster charges, then the big number lands.
    el({ text: "$240K", t0: 42.5, t1: 47.6, fy: [0.44, 0.44], size: 420, weight: 800, color: C.accent, anim: "slam", glow: true });
    el({ text: "in accessibility funding", t0: 43.5, t1: 47.6, fy: [0.66, 0.56], size: 76, weight: 700, anim: "slide" });
    words({
      fy: [0.76, 0.64], size: [46, 60], weight: 600, t1: 47.6,
      words: ["secured", "through", "independent", "advocacy"].map((w, k) => ({ w, t0: 44.5 + k * 0.12, color: C.muted })),
    });
    hit(42.5, [0.44, 0.44], { n: 200, flash: 1, shake: 1.6, ring: true, power: 1.6 });

    // 6. Call to action, 48–56s
    AVATARS.push({ t0: 48, t1: 99, fy: [0.25, 0.3], size: [210, 300] });
    el({ text: "NIKHIL MATH", t0: 48, t1: 99, fy: [0.47, 0.44], size: 150, weight: 800, anim: "slam" });
    el({ text: "erulemath@gmail.com", t0: 49, t1: 99, fy: [0.6, 0.535], size: 54, weight: 700, anim: "slide" });
    el({ text: "linkedin.com/in/nikhil-math", t0: 49.5, t1: 99, fy: [0.67, 0.585], size: 42, weight: 600, color: C.muted, anim: "slide", dir: 1 });
    el({ text: "nikhilmath.com", t0: 50, t1: 99, fy: [0.73, 0.625], size: 42, weight: 600, color: C.muted, anim: "slide" });
    el({ text: "Let's build something.", t0: 51, t1: 99, fy: [0.86, 0.73], size: 84, weight: 800, color: C.accent, anim: "slam", glow: true });
    hit(48, [0.47, 0.44], { n: 60, flash: 0.5, shake: 0.8, ring: true });
    hit(51, [0.86, 0.73], { n: 40, flash: 0.2, shake: 0.5 });

    // ---- Drawing ----------------------------------------------------------------

    function setFont(size, weight, track = 0) {
      ctx.font = `${weight} ${size}px ${FONT}`;
      if ("letterSpacing" in ctx) ctx.letterSpacing = `${track}px`;
    }

    function fitSize(text, size, weight, track, maxW) {
      setFont(size, weight, track);
      const w = ctx.measureText(text).width;
      return w > maxW ? Math.floor(size * maxW / w) : size;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawEl(e, t) {
      const exit = e.exit ?? 0.25;
      if (t < e.t0 || t > e.t1 + exit) return;
      const weight = e.weight ?? 700;
      const track = e.track ?? 0;
      // Vertical video is watched on phones, so text runs larger there.
      const size = e.fixed ? val(e.size) : fitSize(e.text, val(e.size) * F(1, 1.3), weight, track, W * (e.maxW ?? 0.88));
      const p = t - e.t0;
      let s = 1, dx = 0, dy = 0, a = 1, text = e.text;

      if (e.anim === "slam") {
        const d = 0.2, q = clamp01(p / d);
        s = 1 + 1.6 * (1 - easeOutCubic(q));
        if (q >= 1) s = 1 + 0.06 * Math.exp(-(p - d) * 18) * Math.cos((p - d) * 40);
        a = clamp01(p / 0.08);
      } else if (e.anim === "slide") {
        const q = easeOutExpo(clamp01(p / 0.45));
        dx = (1 - q) * 260 * (e.dir || -1);
        a = clamp01(p / 0.2);
      } else if (e.anim === "pop") {
        s = 0.4 + 0.6 * easeOutBack(clamp01(p / 0.3));
        a = clamp01(p / 0.12);
      } else if (e.anim === "fly") {
        const q = easeOutExpo(clamp01(p / 0.3));
        dx = (1 - q) * W * 0.7 * (e.dir || 1);
        s = 1 + (1 - q) * 0.4;
        a = clamp01(p / 0.1);
      }

      if (t > e.t1) {
        const q = clamp01((t - e.t1) / exit);
        a *= 1 - q;
        if (e.anim === "fly") dx -= easeInCubic(q) * W * 0.7 * (e.dir || 1);
        else dy -= q * 40;
      }
      if (a <= 0) return;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(W * val(e.fx ?? 0.5) + dx, H * val(e.fy) + dy);
      ctx.scale(s, s);
      setFont(size, weight, track);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (e.glow) {
        ctx.shadowColor = e.color || C.text;
        ctx.shadowBlur = 50;
      }
      ctx.fillStyle = e.color || C.text;
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function drawWords(line, t) {
      if (t < line.words[0].t0 || t > line.t1 + 0.25) return;
      const size = val(line.size);
      const weight = line.weight ?? 700;
      setFont(size, weight);
      const space = ctx.measureText(" ").width;
      const maxW = W * (line.maxW ?? 0.84);

      const lines = [];
      let cur = [], curW = 0;
      for (const wd of line.words) {
        const ww = ctx.measureText(wd.w).width;
        if (cur.length && (wd.br && format === "h" || curW + space + ww > maxW)) {
          lines.push({ items: cur, width: curW });
          cur = [];
          curW = 0;
        }
        curW += (cur.length ? space : 0) + ww;
        cur.push({ ...wd, ww });
      }
      lines.push({ items: cur, width: curW });

      const lh = size * 1.22;
      const y0 = H * val(line.fy) - (lines.length - 1) * lh / 2;
      lines.forEach((ln, i) => {
        let x = W / 2 - ln.width / 2;
        for (const it of ln.items) {
          drawEl({
            text: it.w, t0: it.t0, t1: line.t1, fixed: true,
            fx: (x + it.ww / 2) / W, fy: (y0 + i * lh) / H,
            size, weight, color: it.color, anim: it.anim || "pop",
          }, t);
          x += it.ww + space;
        }
      });
    }

    function drawAvatar(av, t) {
      if (!avatar.complete || !avatar.naturalWidth) return;
      if (t < av.t0 || t > av.t1 + 0.25) return;
      const p = t - av.t0;
      let a = clamp01(p / 0.1);
      if (t > av.t1) a *= 1 - clamp01((t - av.t1) / 0.25);
      const size = val(av.size) * (0.3 + 0.7 * easeOutBack(clamp01(p / 0.35)));
      const x = W / 2 - size / 2;
      const y = H * val(av.fy) - size / 2;
      ctx.save();
      ctx.globalAlpha = a;
      roundRect(x, y, size, size, size * 0.16);
      ctx.save();
      ctx.clip();
      ctx.drawImage(avatar, x, y, size, size);
      ctx.restore();
      ctx.lineWidth = 5;
      ctx.strokeStyle = C.accent;
      ctx.stroke();
      ctx.restore();
    }

    function drawBackground(t) {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);

      const R = Math.max(W, H);
      const glow = (x, y, r, color, alpha) => {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color.replace("A", alpha));
        g.addColorStop(1, color.replace("A", 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      };
      glow(W * (0.18 + 0.05 * Math.sin(t * 0.3)), H * 0.2, R * 0.6, "rgba(196, 114, 64, A)", 0.22);
      glow(W * (0.85 + 0.04 * Math.cos(t * 0.25)), H * 0.9, R * 0.55, "rgba(255, 123, 114, A)", 0.12);

      // Scrolling grid, faster during the skills barrage.
      const off = (t * 50 + Math.max(0, Math.min(t, 41) - 34) * 400) % 80;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.045)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = off - 80; y <= H; y += 80) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();

      if (t > 34 && t < 41) {
        const rnd = mulberry32(99);
        ctx.fillStyle = "rgba(255, 184, 108, 0.14)";
        for (let i = 0; i < 40; i++) {
          const y = rnd() * H, len = 200 + rnd() * 600, sp = 2000 + rnd() * 2500, ph = rnd() * W * 2;
          const x = ((t * sp + ph) % (W + len * 2)) - len;
          ctx.fillRect(x, y, len, 3);
        }
      }

      // Rotating rays behind the highlight.
      if (t > 42.5 && t < 48) {
        const a = clamp01((t - 42.5) / 0.4) * clamp01((47.8 - t) / 0.4);
        ctx.save();
        ctx.translate(W / 2, H * F(0.44, 0.44));
        ctx.rotate(t * 0.15);
        ctx.fillStyle = `rgba(255, 184, 108, ${0.07 * a})`;
        for (let i = 0; i < 18; i++) {
          ctx.rotate(Math.PI * 2 / 18);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(R, -R * 0.09);
          ctx.lineTo(R, R * 0.09);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      const v = ctx.createRadialGradient(W / 2, H / 2, R * 0.25, W / 2, H / 2, R * 0.75);
      v.addColorStop(0, "rgba(0, 0, 0, 0)");
      v.addColorStop(1, "rgba(0, 0, 0, 0.6)");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);
    }

    function drawLasers(t) {
      for (const L of LASERS) {
        const dt = t - (L.t - 0.16);
        if (dt < 0 || dt > 0.3) continue;
        const y = H * val(L.fy);
        const tx = W / 2;
        const head = -100 + (tx + 100) * clamp01(dt / 0.16);
        const tail = -100 + (tx + 100) * clamp01((dt - 0.08) / 0.2);
        ctx.save();
        ctx.globalAlpha = dt > 0.16 ? 1 - (dt - 0.16) / 0.14 : 1;
        ctx.lineCap = "round";
        ctx.shadowColor = C.accent;
        ctx.shadowBlur = 40;
        ctx.strokeStyle = C.accent;
        ctx.lineWidth = 26;
        ctx.beginPath();
        ctx.moveTo(tail, y);
        ctx.lineTo(head, y);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawBursts(t) {
      for (const h of HITS) {
        const dt = t - h.t;
        if (dt < 0 || dt > 1.4) continue;
        const cx = W / 2, cy = H * val(h.fy);

        if (h.ring && dt < 0.55) {
          const q = dt / 0.55;
          ctx.globalAlpha = (1 - q) * 0.8;
          ctx.strokeStyle = C.accent;
          ctx.lineWidth = 10 * (1 - q) + 1;
          ctx.beginPath();
          ctx.arc(cx, cy, easeOutCubic(q) * Math.max(W, H) * 0.45, 0, Math.PI * 2);
          ctx.stroke();
        }

        const rnd = mulberry32(h.seed);
        for (let i = 0; i < h.n; i++) {
          const ang = rnd() * Math.PI * 2;
          const spd = (300 + rnd() * 1300) * h.power;
          const life = 0.5 + rnd() * 0.8;
          const size = 3 + rnd() * 7;
          const pick = rnd();
          if (dt > life) continue;
          const k = 3.2;
          const d = spd * (1 - Math.exp(-k * dt)) / k;
          const x = cx + Math.cos(ang) * d;
          const y = cy + Math.sin(ang) * d + 140 * dt * dt;
          const len = Math.min(60, spd * Math.exp(-k * dt) * 0.03) + size;
          ctx.globalAlpha = 1 - dt / life;
          ctx.fillStyle = pick < 0.65 ? C.accent : pick < 0.85 ? C.coral : "#fff";
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(ang);
          ctx.fillRect(-len, -size / 4, len, size / 2);
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
    }

    // The blaster charges up before the highlight lands.
    function drawCharge(t) {
      if (t < 41 || t > 42.6) return;
      const cx = W / 2, cy = H * F(0.44, 0.44);
      const dark = t < 42.5 ? clamp01(t - 41) * 0.65 : 0;
      if (dark > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${dark})`;
        ctx.fillRect(0, 0, W, H);
      }
      if (t >= 42.5) return;
      const p = clamp01((t - 41) / 1.5);
      const R = Math.max(W, H) * 0.5;

      const rnd = mulberry32(4242);
      ctx.fillStyle = C.accent;
      for (let i = 0; i < 70; i++) {
        const ang = rnd() * Math.PI * 2;
        const r0 = R * (0.5 + rnd() * 0.6);
        const delay = rnd() * 0.5;
        const q = clamp01((p - delay) / (1 - delay));
        if (q <= 0) continue;
        const r = r0 * (1 - easeInCubic(q));
        ctx.globalAlpha = q;
        ctx.fillRect(cx + Math.cos(ang) * r - 3, cy + Math.sin(ang) * r - 3, 6, 6);
      }

      ctx.globalAlpha = 0.3 + 0.7 * p;
      ctx.strokeStyle = C.accent;
      ctx.lineWidth = 3 + p * 8;
      ctx.beginPath();
      ctx.arc(cx, cy, (1 - easeInCubic(p)) * R + 10, 0, Math.PI * 2);
      ctx.stroke();

      const core = 20 + p * 110;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, core);
      g.addColorStop(0, `rgba(255, 255, 255, ${p})`);
      g.addColorStop(0.4, `rgba(255, 184, 108, ${0.8 * p})`);
      g.addColorStop(1, "rgba(255, 184, 108, 0)");
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(cx - core, cy - core, core * 2, core * 2);
    }

    function drawWipes(t) {
      for (const wt of WIPES) {
        const q = (t - (wt - 0.22)) / 0.44;
        if (q < 0 || q > 1) continue;
        const band = W * 0.35;
        const skew = H * 0.35;
        const x = -band - skew + (W + band + skew * 2) * q;
        const bar = (x0, w, color) => {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x0 + skew, 0);
          ctx.lineTo(x0 + skew + w, 0);
          ctx.lineTo(x0 + w, H);
          ctx.lineTo(x0, H);
          ctx.closePath();
          ctx.fill();
        };
        bar(x - band * 0.35, band * 0.18, C.coral);
        bar(x, band, C.accent);
      }
    }

    function shakeAt(t) {
      let x = 0, y = 0;
      for (const h of HITS) {
        const dt = t - h.t;
        if (dt < 0 || dt > 0.8) continue;
        const a = h.shake * 26 * Math.exp(-dt * 8);
        x += Math.sin(dt * 90 + h.seed) * a;
        y += Math.cos(dt * 77 + h.seed * 1.3) * a;
      }
      return [x, y];
    }

    function render(t) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      drawBackground(t);

      const [sx, sy] = shakeAt(t);
      ctx.save();
      ctx.translate(sx, sy);
      drawCharge(t);
      for (const av of AVATARS) drawAvatar(av, t);
      for (const e of EL) drawEl(e, t);
      for (const w of WORDS) drawWords(w, t);
      drawLasers(t);
      drawBursts(t);
      ctx.restore();

      drawWipes(t);

      let flash = 0;
      for (const h of HITS) {
        const dt = t - h.t;
        if (dt >= 0 && dt < 0.6) flash += h.flash * Math.exp(-dt * 9);
      }
      if (flash > 0.01) {
        ctx.fillStyle = `rgba(255, 236, 214, ${Math.min(0.9, flash)})`;
        ctx.fillRect(0, 0, W, H);
      }

      const fade = clamp01((t - 55.2) / 0.8);
      if (fade > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${fade})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // ---- Music ------------------------------------------------------------------
    // An original 120 BPM track synthesized with Web Audio, so the music is
    // royalty-free and every hit lines up with the visuals above.

    let ac = null, master = null, recDest = null, noiseBuf = null, bus = null;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    function ensureAudio() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 4;
      comp.attack.value = 0.003;
      comp.release.value = 0.2;
      master = ac.createGain();
      master.gain.value = 0.9;
      master.connect(comp);
      comp.connect(ac.destination);
      recDest = ac.createMediaStreamDestination();
      comp.connect(recDest);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }

    function env(g, t, v, attack, end, swell) {
      g.gain.setValueAtTime(0.0001, t);
      if (swell) g.gain.linearRampToValueAtTime(v, t + attack);
      else g.gain.exponentialRampToValueAtTime(v, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
    }

    function noise(out, t, { type, freq, q = 1, dur, v, attack = 0.002, sweepTo, swell }) {
      const s = ac.createBufferSource();
      s.buffer = noiseBuf;
      const f = ac.createBiquadFilter();
      f.type = type;
      f.frequency.setValueAtTime(freq, t);
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
      f.Q.value = q;
      const g = ac.createGain();
      env(g, t, v, attack, t + dur, swell);
      s.connect(f);
      f.connect(g);
      g.connect(out);
      s.start(t, Math.random() * 1.5);
      s.stop(t + dur + 0.05);
    }

    function tone(out, t, { type, freq, freqTo, dur, v, attack = 0.005, filter, swell }) {
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (freqTo) o.frequency.exponentialRampToValueAtTime(freqTo, t + dur * 0.6);
      const g = ac.createGain();
      env(g, t, v, attack, t + dur, swell);
      let node = o;
      if (filter) {
        const f = ac.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.setValueAtTime(filter[0], t);
        f.frequency.exponentialRampToValueAtTime(filter[1], t + dur);
        f.Q.value = filter[2] ?? 1;
        o.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(out);
      o.start(t);
      o.stop(t + dur + 0.05);
    }

    const kick = (out, t, v = 1) => {
      tone(out, t, { type: "sine", freq: 150, freqTo: 42, dur: 0.4, v: 0.9 * v });
      noise(out, t, { type: "highpass", freq: 3000, dur: 0.02, v: 0.15 * v });
    };
    const clap = (out, t) => {
      noise(out, t, { type: "bandpass", freq: 1600, q: 0.8, dur: 0.18, v: 0.45 });
      noise(out, t + 0.012, { type: "bandpass", freq: 1900, q: 0.8, dur: 0.12, v: 0.25 });
    };
    const hat = (out, t, v) => noise(out, t, { type: "highpass", freq: 7500, dur: 0.05, v });
    const bass = (out, t, midi, dur, v = 0.22) =>
      tone(out, t, { type: "sawtooth", freq: mtof(midi), dur, v, filter: [900, 180, 4] });
    const pluck = (out, t, midi) =>
      tone(out, t, { type: "square", freq: mtof(midi), dur: 0.14, v: 0.05, filter: [3200, 700, 2] });
    const zap = (out, t) =>
      tone(out, t, { type: "sawtooth", freq: 2400, freqTo: 180, dur: 0.18, v: 0.16, filter: [5000, 1500, 1] });
    const whoosh = (out, t) =>
      noise(out, t, { type: "bandpass", freq: 400, sweepTo: 3500, q: 1.2, dur: 0.38, v: 0.28, attack: 0.18 });

    function boom(out, t, amt) {
      const a = Math.min(1, amt);
      tone(out, t, { type: "sine", freq: 120, freqTo: 32, dur: 0.9, v: 0.9 * a, attack: 0.008 });
      noise(out, t, { type: "lowpass", freq: 1200, q: 0.7, dur: 0.6, v: 0.5 * a });
      noise(out, t, { type: "highpass", freq: 4000, q: 0.7, dur: 0.12, v: 0.25 * a });
    }

    function pad(out, t, notes, dur, v) {
      const f = ac.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = 1400;
      f.Q.value = 0.5;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.08);
      g.gain.setValueAtTime(v, t + dur - 0.15);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      f.connect(g);
      g.connect(out);
      for (const n of notes) {
        for (const detune of [-8, 8]) {
          const o = ac.createOscillator();
          o.type = "sawtooth";
          o.frequency.value = mtof(n);
          o.detune.value = detune;
          o.connect(f);
          o.start(t);
          o.stop(t + dur + 0.05);
        }
      }
    }

    const CHORDS = {
      Am: { root: 45, pad: [57, 60, 64] },
      F: { root: 41, pad: [57, 60, 65] },
      C: { root: 48, pad: [55, 60, 64] },
      G: { root: 43, pad: [55, 59, 62] },
    };
    const PROG = ["Am", "F", "C", "G"];

    function scheduleMusic(t0) {
      const out = bus = ac.createGain();
      out.connect(master);
      out.gain.setValueAtTime(1, t0);
      out.gain.setValueAtTime(1, t0 + 53.5);
      out.gain.linearRampToValueAtTime(0.0001, t0 + DURATION + 0.2);

      for (let bar = 0; bar < 28; bar++) {
        const start = bar * 2;
        const chord = bar >= 26 ? CHORDS.Am : CHORDS[PROG[bar % 4]];
        if (bar === 26) pad(out, t0 + start, chord.pad, 4, 0.05);
        else if (bar < 26 && bar !== 20) pad(out, t0 + start, chord.pad, 2, bar < 2 ? 0.05 : 0.03);

        for (let beat = 0; beat < 4; beat++) {
          const s = start + beat * 0.5;
          const t = t0 + s;
          const intro = s < 4;
          const charge = s >= 41 && s < 42.5;
          const half = s >= 42.5 && s < 44;
          const outro = s >= 52;
          const skills = s >= 34 && s < 41;

          if (!intro && !charge && !half && !outro) kick(out, t);
          if (half && beat === 0) kick(out, t, 0.8);
          if (!intro && !charge && !half && !outro && s >= 6 && beat % 2 === 1) clap(out, t);

          if (!charge && !outro) {
            hat(out, t, intro ? 0.04 : 0.06);
            hat(out, t + 0.25, intro ? 0.07 : 0.13);
            if (skills) {
              hat(out, t + 0.125, 0.05);
              hat(out, t + 0.375, 0.05);
            }
          }

          if (s >= 4 && !charge && !half && !outro) {
            bass(out, t, chord.root, 0.22);
            bass(out, t + 0.25, chord.root + (beat === 3 ? 12 : 0), 0.22, 0.18);
          }

          if (skills) {
            const arp = chord.pad.map(n => n + 12);
            [0, 1, 2, 1].forEach((k, i) => pluck(out, t + i * 0.125, arp[k]));
          }
        }
      }

      // The highlight: the beat drops out while the blaster charges, then hits.
      noise(out, t0 + 41, { type: "bandpass", freq: 300, sweepTo: 7000, q: 1.5, dur: 1.45, v: 0.35, attack: 1.4, swell: true });
      tone(out, t0 + 41, { type: "sawtooth", freq: 80, freqTo: 900, dur: 1.45, v: 0.1, attack: 1.4, filter: [400, 4000, 2], swell: true });
      bass(out, t0 + 42.5, 33, 1.5, 0.3);
      pad(out, t0 + 42.5, CHORDS.F.pad, 1.5, 0.05);

      for (const h of HITS) boom(out, t0 + h.t, h.shake);
      for (const L of LASERS) zap(out, t0 + L.t - 0.16);
      for (const w of WIPES) whoosh(out, t0 + w - 0.3);
    }

    function stopMusic() {
      if (!bus) return;
      const b = bus;
      bus = null;
      b.gain.cancelScheduledValues(ac.currentTime);
      b.gain.setValueAtTime(b.gain.value, ac.currentTime);
      b.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.08);
      setTimeout(() => b.disconnect(), 300);
    }

    // ---- Playback & recording -----------------------------------------------------

    const REC_TYPES = [
      "video/mp4;codecs=avc1.640028,mp4a.40.2",
      "video/mp4;codecs=avc1,mp4a.40.2",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm",
    ];
    const recType = window.MediaRecorder && canvas.captureStream
      ? REC_TYPES.find(t => MediaRecorder.isTypeSupported(t))
      : null;
    if (!recType) recBtn.hidden = true;

    let playing = false;
    let startAt = 0;
    let recorder = null;
    let chunks = [];
    let cancelled = false;
    let lastUrl = null;

    const fontsReady = Promise.all([
      document.fonts.load(`800 100px ${FONT}`),
      document.fonts.load(`700 100px ${FONT}`),
      document.fonts.load(`600 100px ${FONT}`),
    ]).catch(() => {});

    const clock = () => (ac ? ac.currentTime : performance.now() / 1000) - startAt;

    async function play(record) {
      await fontsReady;
      ensureAudio();
      if (ac && ac.state === "suspended") await ac.resume();
      ui.hidden = true;
      document.body.classList.add("playing");
      cancelled = false;
      dl.innerHTML = "";

      // Clear the poster frame so recordings open on the background, not a flash of it.
      render(-1);
      if (record) startRecorder();
      startAt = (ac ? ac.currentTime : performance.now() / 1000) + 0.15;
      if (ac) scheduleMusic(startAt);
      playing = true;
      requestAnimationFrame(loop);
    }

    function loop() {
      if (!playing) return;
      const t = clock();
      render(t);
      if (t >= DURATION) { finish(); return; }
      requestAnimationFrame(loop);
    }

    function finish() {
      playing = false;
      document.body.classList.remove("playing");
      if (recorder) {
        note.textContent = "Saving your video…";
        setTimeout(() => recorder && recorder.stop(), 250);
      }
      showUi(true);
    }

    function stop() {
      if (!playing) return;
      playing = false;
      cancelled = true;
      stopMusic();
      document.body.classList.remove("playing");
      if (recorder) recorder.stop();
      renderPoster();
      showUi(false);
    }

    function startRecorder() {
      const stream = new MediaStream([
        ...canvas.captureStream(30).getVideoTracks(),
        ...(recDest ? recDest.stream.getAudioTracks() : []),
      ]);
      chunks = [];
      recorder = new MediaRecorder(stream, { mimeType: recType, videoBitsPerSecond: 8_000_000 });
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const rec = recorder;
        recorder = null;
        if (cancelled) { note.textContent = "Recording cancelled."; return; }
        const blob = new Blob(chunks, { type: rec.mimeType || recType });
        const ext = blob.type.startsWith("video/mp4") ? "mp4" : "webm";
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        const name = `resume-blaster-${format === "h" ? "16x9" : "9x16"}.${ext}`;
        const mb = (blob.size / 1e6).toFixed(1);
        dl.innerHTML = `<a class="btn primary" href="${lastUrl}" download="${name}">&#8595; download ${name} (${mb} MB)</a>`;
        note.textContent = ext === "mp4"
          ? "Recorded. Ready for LinkedIn and YouTube."
          : "Recorded as WebM, which LinkedIn won't accept. Recent versions of Chrome and Safari record MP4 instead.";
      };
      recorder.start(1000);
      note.textContent = "";
    }

    function showUi(ended) {
      document.getElementById("uiTitle").textContent = ended ? "That's the trailer." : "Resume Blaster";
      document.getElementById("uiSub").textContent = ended
        ? "Play it again, switch formats, or record it to a video file."
        : "The trailer · 56 seconds · sound on";
      playBtn.innerHTML = ended ? "&#8635; replay" : "&#9654; play";
      if (!recorder && !ended) note.textContent = "";
      if (!recorder && ended && !dl.innerHTML) {
        note.textContent = recType
          ? "Record video plays the trailer again and saves it with the music. It runs in real time, so keep this tab in front for the full 56 seconds."
          : "";
      }
      ui.hidden = false;
      playBtn.focus({ preventScroll: true });
    }

    // ---- Layout -------------------------------------------------------------------

    function fit() {
      const s = Math.min(window.innerWidth / W, window.innerHeight / H);
      canvas.style.width = `${Math.floor(W * s)}px`;
      canvas.style.height = `${Math.floor(H * s)}px`;
    }

    function renderPoster() { render(1.15); }

    function setFormat(f) {
      if (playing) return;
      format = f;
      W = f === "h" ? 1920 : 1080;
      H = f === "h" ? 1080 : 1920;
      canvas.width = W;
      canvas.height = H;
      for (const b of document.querySelectorAll("[data-format]")) {
        b.setAttribute("aria-pressed", String(b.dataset.format === f));
      }
      const url = new URL(location.href);
      if (f === "v") url.searchParams.set("format", "vertical");
      else url.searchParams.delete("format");
      history.replaceState(null, "", url);
      fit();
      renderPoster();
    }

    document.querySelectorAll("[data-format]").forEach(b => {
      b.addEventListener("click", () => setFormat(b.dataset.format));
    });
    playBtn.addEventListener("click", () => play(false));
    recBtn.addEventListener("click", () => play(true));
    window.addEventListener("keydown", e => { if (e.key === "Escape") stop(); });
    window.addEventListener("resize", fit);
    avatar.addEventListener("load", () => { if (!playing) renderPoster(); });

    setFormat(format);
    fontsReady.then(() => { if (!playing) renderPoster(); });
    if (recType) {
      note.textContent = "Record video plays the trailer and saves it with the music. It runs in real time, so keep this tab in front for the full 56 seconds.";
    }

    // Lets tests and screenshots jump to any moment: ?t=42.6
    const peek = parseFloat(new URLSearchParams(location.search).get("t"));
    if (!Number.isNaN(peek)) {
      fontsReady.then(() => {
        ui.hidden = true;
        const draw = () => render(peek);
        draw();
        avatar.addEventListener("load", draw);
      });
    }
  })();
  </script>
</body>
</html>
