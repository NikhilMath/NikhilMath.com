*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(160deg,#fff4e6,#ffe0c2 55%,#ffc9a3);font-family:Inter,sans-serif;color:#2a1a0e;display:flex;align-items:center;gap:72px;padding:0 90px}
